services:
  - type: web
    name: routeme
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./ai4se-baseline/RouteME/Dockerfile
    dockerContext: ./ai4se-baseline/RouteME
    healthCheckPath: /api/greeting
    # CD 由 .github/workflows/cd.yml 在 CI 全绿后触发 deploy hook；
    # 关掉自动部署，避免 Render 抢在 CI 之前上线未验证的提交。
    autoDeploy: false
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:sqlite:/data/routeme.db
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75
    # 免费实例没有持久盘：/data 随实例重建而清空，重启后回到 Flyway 种子数据。
    # 需要保留用户数据时，把 plan 改成 starter 并取消下面四行注释。
    # disk:
    #   name: routeme-data
    #   mountPath: /data
    #   sizeGB: 1