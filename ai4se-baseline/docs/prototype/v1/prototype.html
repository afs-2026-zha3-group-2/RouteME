<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RouteMe 路觅 · 找到同路的人</title>
<meta name="description" content="RouteMe 路觅 MVP 原型：从旅行灵感到发布行程、发现同行者、建立连接、一起旅行、分享体验的完整闭环。">
<link rel="stylesheet" href="styles.css?v=20261116a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f4c5c'/%3E%3Cpath d='M8 22c4-10 12-10 16 0' stroke='%23ff6b35' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11' r='3' fill='%23ffb703'/%3E%3C/svg%3E">
</head>
<body>

<div class="ambient" aria-hidden="true">
  <div class="ambient-mesh"></div>
  <div class="ambient-drift d1"></div>
  <div class="ambient-drift d2"></div>
  <div class="ambient-drift d3"></div>
  <div class="ambient-grain"></div>
</div>

<!-- ============ S01 演示身份选择 ============ -->
<section id="gate" class="gate" aria-label="登录或选择演示身份"></section>

<!-- ============ 应用外壳 ============ -->
<div id="shell" class="shell" hidden>
  <header class="topbar">
    <a class="brand" href="#/discover" aria-label="RouteMe 路觅 首页">
      <svg class="brand-bare" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 24c5-13 17-13 22 0" fill="none" stroke="var(--coral)" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="10" r="3.4" fill="var(--amber)"/></svg>
      <span class="brand-text"><b>RouteMe</b><i>路觅</i></span>
    </a>

    <div class="topbar-spacer"></div>

    <a class="ghost-btn demo-btn" href="index.html" title="回到原型包总入口">
      <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 5 7.5 10l5 5"/></svg>
      <span>原型包</span>
    </a>

    <button class="ghost-btn demo-btn" data-action="open-script" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>演示脚本</span>
    </button>

    <button class="icon-btn undo-top" data-action="undo" type="button" id="undo-btn" hidden aria-label="撤销上一步" title="撤销上一步">
      <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 10a6.4 6.4 0 1 0 2-4.6"/><path d="M3.4 3.4v3.8h3.8"/></svg>
    </button>

    <button class="icon-btn" data-action="toggle-theme" type="button" aria-label="切换深色模式" title="切换深色模式">
      <svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 1.6v2.2M10 16.2v2.2M1.6 10h2.2M16.2 10h2.2M4.1 4.1l1.6 1.6M14.3 14.3l1.6 1.6M15.9 4.1l-1.6 1.6M5.7 14.3l-1.6 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.4A6.8 6.8 0 0 1 7.6 4a6.9 6.9 0 1 0 8.4 8.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </button>

    <div class="id-switch">
      <button class="id-switch-btn" data-action="id-toggle" type="button" id="user-chip" aria-haspopup="dialog" aria-expanded="false" aria-label="身份菜单"></button>
      <div id="id-panel-root"></div>
    </div>
  </header>

  <aside class="rail" aria-label="主导航">
    <nav class="rail-nav" id="rail-nav"></nav>
    <div class="rail-foot">
      <div class="rail-loop">
        <span class="rail-loop-title">价值闭环</span>
        <ol>
          <li>旅行灵感</li><li>发布行程</li><li>发现同行者</li><li>建立连接</li><li>一起旅行</li><li>分享体验</li>
        </ol>
      </div>
      <button class="rail-undo" data-action="undo" type="button" id="undo-rail" hidden></button>
      <button class="rail-reset" data-action="reset-data" type="button">重置演示数据</button>
    </div>
  </aside>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="底部导航"></nav>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

<script src="data.js?v=20261116a"></script>
<script src="store.js?v=20261116a"></script>
<script src="ui.js?v=20261116a"></script>
<script src="main.js?v=20261116a"></script>
</body>
</html>
