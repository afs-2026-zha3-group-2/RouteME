spring:
  application:
    name: routeme-backend
  # 本地开发密钥写在 backend/application-local.yml（已 gitignore，勿提交）：
  # AMAP_WEB_SERVICE_KEY / AMAP_SECURITY_JS_CODE / DEEPSEEK_API_KEY。
  # 旧的 amap-local.yml / ai-local.yml 仍按可选文件导入，兼容尚未迁移的本地环境。
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:./amap-local.yml
      - optional:file:./ai-local.yml
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
      # 本地从 backend 目录启动时，数据库落在同级 SqlLite/；独立 jar 或自定义路径用 SPRING_DATASOURCE_URL 覆盖。
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:../SqlLite/routeme.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # Flyway 迁移期间需要同时占用迁移连接与历史表连接；SQLite 的写事务本身串行。
      maximum-pool-size: 4
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # 业务上限：头像 2 MB、体验图片单张 5 MB；Spring 上限取两者较大值，避免先于业务校验拒绝。
      max-file-size: 5MB
      max-request-size: 6MB
routeme:
  ai:
    # DeepSeek（OpenAI 兼容）Key：只允许后端代理使用，不下发到浏览器；空白时 generate 返回 503。
    api-key: ${DEEPSEEK_API_KEY:}
    # 测试替身或私有网关可覆盖；默认 DeepSeek 正式服务。
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    # 连接与读取超时秒数；超时按上游失败（502）处理。
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
  profile:
    # 头像落盘目录；从 backend 目录启动时指向 RouteME/SqlLite/uploads/avatars。
    avatar-dir: ${ROUTEME_AVATAR_DIR:../SqlLite/uploads/avatars}
  experience:
    # 游后体验图片落盘目录；uploads/ 已 gitignore。
    photo-dir: ${ROUTEME_EXPERIENCE_PHOTO_DIR:../SqlLite/uploads/experience-photos}
  credit:
    # 退出同行证明图片落盘目录；仅存文件，不对外提供读取入口。
    exit-evidence-dir: ${ROUTEME_EXIT_EVIDENCE_DIR:../SqlLite/uploads/exit-evidence}
  amap:
    # 高德 Web 服务 Key：只允许后端代理使用，不下发到浏览器。
    web-service-key: ${AMAP_WEB_SERVICE_KEY:}
    # 高德 JS API 安全密钥：配合 serviceHost 代理使用，不下发到浏览器。
    security-js-code: ${AMAP_SECURITY_JS_CODE:}
    # 私有网关或测试替身可覆盖；默认高德正式服务。
    base-url: ${AMAP_REST_BASE_URL:https://restapi.amap.com}
  weather:
    # Open-Meteo 免 Key：预报与地理编码各一个地址，测试替身可用环境变量覆盖。
    base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
    geocoding-base-url: ${OPEN_METEO_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
    # 备用预报主机（同一数据源的集合预报）：主用主机被网络阻断时自动切换，数值仍来自 Open-Meteo。
    fallback-base-url: ${OPEN_METEO_FALLBACK_BASE_URL:https://ensemble-api.open-meteo.com}
mybatis-plus:
  # 自定义分页查询的 XML 位置；其余查询由 BaseMapper 与 LambdaQueryWrapper 生成。
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # Spring 复用同一 SqlSession 时，一级缓存会让事务内的重复查询读到旧行；
    # 账号状态、到期时间等可能被同事务内的写入改变，故按语句清空缓存。
    local-cache-scope: statement
server:
  port: ${PORT:8080}