spring:
  application:
    name: routeme-backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
      # 本地从 backend 目录启动时，数据库落在同级 SqlLite/；独立 jar 或自定义路径用 SPRING_DATASOURCE_URL 覆盖。
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:../SqlLite/routeme.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # Flyway 迁移期间需要同时占用迁移连接与历史表连接；SQLite 的写事务本身串行。
      maximum-pool-size: 4
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # 业务上限 2 MB；Spring 默认 1 MB 会先于业务校验拒绝请求。
      max-file-size: 2MB
      max-request-size: 3MB
routeme:
  profile:
    # 头像落盘目录；从 backend 目录启动时指向 RouteME/SqlLite/uploads/avatars。
    avatar-dir: ${ROUTEME_AVATAR_DIR:../SqlLite/uploads/avatars}
mybatis-plus:
  # 自定义分页查询的 XML 位置；其余查询由 BaseMapper 与 LambdaQueryWrapper 生成。
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${PORT:8080}