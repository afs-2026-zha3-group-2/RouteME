                        correct: true
                      - question_id: Q11
                        correct: true
                      - question_id: Q16
                        correct: true
                      - question_id: Q03
                        correct: true
                      - question_id: Q08
                        correct: true
                      - question_id: Q13
                        correct: true
                      - question_id: Q18
                        correct: true
                      - question_id: Q04
                        correct: false
                      - question_id: Q19
                        correct: false
                    recovery_applied: true
                    credit_score: 60
                    credit_level: fair
                failed:
                  value:
                    session_id: 13
                    passed: false
                    score: 7
                    pass_line: 8
                    details:
                      - question_id: Q02
                        correct: true
                      - question_id: Q07
                        correct: false
                      - question_id: Q12
                        correct: true
                      - question_id: Q17
                        correct: true
                      - question_id: Q05
                        correct: true
                      - question_id: Q09
                        correct: false
                      - question_id: Q14
                        correct: true
                      - question_id: Q20
                        correct: true
                      - question_id: Q04
                        correct: false
                      - question_id: Q19
                        correct: false
                    recovery_applied: false
                    credit_score: 45
