          application/json:
            schema:
              $ref: '#/components/schemas/TripMeetingRequest'
            examples:
              success:
                value:
                  meeting_areas: [陈家祠地铁站 D 口]
                  meeting_time: '2026-11-20T08:30'
              clear:
                value:
                  meeting_areas: []
                  meeting_time: null
              invalidTime:
                value:
                  meeting_areas: [陈家祠地铁站 D 口]
                  meeting_time: '2026-12-01T08:30'
