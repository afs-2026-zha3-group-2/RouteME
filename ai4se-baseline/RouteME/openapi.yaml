          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceWriteRequest'
            examples:
              success:
                value:
                  content: 整条线基本没有爬升，骑行段风很大但很值。日落前四十分钟到海滨泳场刚好。
                  intensity: moderate
                  advice: 带一件防风外套，海边傍晚温差比市区大。
              rejected:
                value:
                  content: 太短
                  intensity: relaxed
                  advice: ''
      responses:
        '200':
          description: 已更新我的体验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '201':
          description: 已创建我的体验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '400':
          $ref: '#/components/responses/InvalidInput'
