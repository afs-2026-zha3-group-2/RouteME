  /weather/forecast:
    get:
      operationId: loadWeatherForecast
      summary: 目的地日期天气（Open-Meteo）
      description: |
        按目的地与旅行日期返回 Open-Meteo 的真实天气与出行提醒。
        `destination_code` 与 `lng`/`lat` 至少提供一组：携带坐标时优先使用（例如高德选点结果），
        否则按 6 位区划码解析城市中心坐标，用户无需再次输入城市。
        日期窗口为今天 ≤ date ≤ 今天 + 15（`Asia/Shanghai`）；越界返回 200 且 `available=false`（`reason=OUT_OF_RANGE`），
        不返回任何天气数值与提醒。上游失败返回 502 `WEATHER_UPSTREAM_ERROR`，绝不伪造天气。
        成功结果在服务端按「日期 + 坐标（约 1 km）」缓存，默认 30 分钟；`refresh=true` 跳过缓存读取并覆盖缓存，
        `DELETE /weather/cache` 可清空全部缓存，便于上游预报更新后立即取新值。
      parameters:
        - name: destination_code
          in: query
          required: false
          description: 目的地 6 位行政区划代码；与 `lng`/`lat` 至少提供一组
          schema:
            type: string
            pattern: '^[0-9]{6}$'
            example: '440100'
        - name: date
          in: query
          required: true
          description: 旅行日期；今天 ≤ date ≤ 今天 + 15
          schema:
            type: string
            format: date
        - name: lng
          in: query
          required: false
          description: 已有目的地经度（如高德选点结果）；必须与 `lat` 成对出现
          schema:
            type: number
            format: double
        - name: lat
          in: query
          required: false
          description: 已有目的地纬度；必须与 `lng` 成对出现
          schema:
            type: number
            format: double
        - name: refresh
          in: query
          required: false
          description: |
            `true` 时跳过后端缓存，强制向上游重新获取并用新结果覆盖缓存；默认 `false`（命中缓存直接返回）。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 可用天气，或日期超出预报窗口的不可用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherForecast'
              examples:
                available:
                  value:
                    date: '2026-11-21'
                    destination_code: '440100'
                    city: 广州市
                    lng: 113.2644
                    lat: 23.1291
                    available: true
                    weather:
                      weather_code: 61
                      weather_text: 小雨
                      temp_max_c: 24.0
                      temp_min_c: 17.0
                      precipitation_probability_pct: 80
                      precipitation_mm: 5.2
                      wind_speed_kmh: 18.0
                      uv_index: 3.0
                    reminders:
                      - code: rain
                        text: 降雨概率 80%，记得带伞和雨具，户外行程注意防雨。降雨明显，建议调整户外行程。
                    source: open-meteo
                outOfRange:
                  value:
                    date: '2026-12-20'
                    destination_code: '440100'
                    city: 广州市
                    lng: null
                    lat: null
                    available: false
                    reason: OUT_OF_RANGE
                    reminders: []
                    source: open-meteo
        '400':
          $ref: '#/components/responses/InvalidInput'
        '500':
          $ref: '#/components/responses/Unexpected'
        '502':
          description: Open-Meteo 或地理编码不可用，或没有请求当日的数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                upstream:
                  value:
                    code: WEATHER_UPSTREAM_ERROR
  /weather/cache:
    delete:
      operationId: clearWeatherCache
      summary: 清空目的地天气缓存
      description: |
        清空服务端进程内的天气预报缓存，后续查询重新访问 Open-Meteo。
        用于上游预报发生明显变化（如临近发布、极端天气预警）时立刻拉取最新数据；
        只想刷新单个查询时优先使用 `/weather/forecast?refresh=true`，避免整体回源。
      responses:
        '200':
          description: 清理完成，返回被移除的缓存条目数
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared:
                    type: integer
                    minimum: 0
                    description: 被清理的缓存条目数
              examples:
                cleared:
                  value:
                    cleared: 12
        '500':
          $ref: '#/components/responses/Unexpected'
