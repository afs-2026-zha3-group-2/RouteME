            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidTime:
                  value:
                    code: INVALID_INPUT
                    fields:
                      meeting_time: INVALID_DATE
        '401':
          description: 缺少或未知的演示身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: DEMO_USER_REQUIRED
        '403':
          description: 非发布者不能编辑集合信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
        '404':
          description: 行程不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: TRIP_NOT_FOUND
        '409':
          description: 行程已结束
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyCompleted:
                  value:
                    code: TRIP_NOT_OPEN
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
