        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /experiences:
    get:
      operationId: loadExperiences
      summary: 旅行体验列表
      description: 已发布体验，按最近保存时间倒序；支持关键词、目的地与兴趣筛选，结果按页返回。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          required: false
          description: 关键词，命中行程标题/目的地/感受/建议
          schema:
            type: string
        - name: destination
          in: query
          required: false
          schema:
            type: string
        - name: tags
          in: query
          required: false
          description: 逗号分隔，任一命中
          schema:
            type: string
      responses:
        '200':
          description: 体验列表的一页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperiencePage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /me/experiences:
    get:
      operationId: loadMyExperiences
      summary: 我的旅行体验
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      responses:
        '200':
          description: 我的体验列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /trips/{tripId}/experiences:
    get:
      operationId: loadTripExperiences
      summary: 某条行程的游后体验
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 体验列表，按首次发布时间升序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: shareTripExperience
      summary: 发布或修改我的游后体验
      description: 仅已结束且自己参加过的行程；同一用户对同一行程只有一条体验，再次提交即修改。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceWriteRequest'
            examples:
              success:
                value:
                  content: 整条线基本没有爬升，骑行段风很大但很值。日落前四十分钟到海滨泳场刚好。
                  intensity: moderate
                  advice: 带一件防风外套，海边傍晚温差比市区大。
              rejected:
                value:
                  content: 太短
                  intensity: relaxed
                  advice: ''
      responses:
        '200':
          description: 已更新我的体验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '201':
          description: 已创建我的体验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
components:
  parameters:
    DemoUserId:
      name: X-User-Id
      in: header
      required: true
      description: 演示身份标识（app_users.id）。演示环境无真实鉴权，生产前必须替换。
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 起；小于 1 视为非法输入。
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数，默认 20，最大 50；超出范围视为非法输入。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    BearerToken:
      name: Authorization
      in: header
      required: true
      description: 登录会话，格式 `Bearer <token>`。
      schema:
        type: string
  responses:
    DemoUserRequired:
      description: 缺少或未知的演示身份
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                code: DEMO_USER_REQUIRED
    InvalidInput:
      description: 输入不满足契约或业务约束
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                code: INVALID_INPUT
    Forbidden:
      description: 当前身份无权执行该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                code: TRIP_NOT_FOUND
    Conflict:
      description: 当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                code: DUPLICATE_APPLICATION
    Unexpected:
      description: 未预期异常，响应不携带堆栈
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unexpected:
              value:
                code: INTERNAL_ERROR
  schemas:
    Greeting:
      type: object
      required: [id, message]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: 问候语记录标识
        message:
          type: string
          readOnly: true
          description: 问候语文本，来自 greetings 表的 message 列
    DemoUser:
      type: object
      required: [id, nickname, avatar_initial, bio, interests, profile_complete]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nickname:
          type: string
          readOnly: true
          description: 发布者昵称；唯一来源是 app_users.nickname
        avatar_initial:
          type: string
          readOnly: true
          description: 头像首字；无头像时的展示回退
        avatar_url:
          type: string
          nullable: true
          readOnly: true
          description: 头像地址（含缓存版本参数）；无头像时省略
        school:
          type: string
          nullable: true
          readOnly: true
          description: 学校与年级；选填，迁移前账号保留旧文案
        city:
          type: string
          nullable: true
          readOnly: true
          description: 所在城市
        major:
          type: string
          nullable: true
          readOnly: true
          description: 专业
        job:
          type: string
          nullable: true
          readOnly: true
          enum: [学生, 上班族, 自由职业, 其他]
          description: 职业
        bio:
          type: string
          readOnly: true
          description: 简介
        interests:
          type: array
          readOnly: true
          maxItems: 5
          items:
            type: string
            maxLength: 12
          description: 旅行兴趣标签
        profile_complete:
          type: boolean
          readOnly: true
          description: 由必填字段派生的资料完善状态，不落库
    UserProfile:
      type: object
      required: [id, nickname, avatar_initial, interests, profile_complete]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nickname:
          type: string
          readOnly: true
        avatar_initial:
          type: string
          readOnly: true
          description: 无头像时的展示回退字符（昵称首字）
        avatar_url:
          type: string
          nullable: true
          readOnly: true
          description: 头像地址 `/api/users/{id}/avatar?v={8 位 hex}`；无头像时省略
        birthday:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: 仅本人读取时出现；他人响应省略该键
        age:
          type: integer
          nullable: true
          readOnly: true
          description: 按当前日期计算的周岁；无生日时省略
        zodiac:
          type: string
          nullable: true
          readOnly: true
          enum: [摩羯, 水瓶, 双鱼, 白羊, 金牛, 双子, 巨蟹, 狮子, 处女, 天秤, 天蝎, 射手]
          description: 由生日派生的星座；无生日时省略
        gender:
          type: string
          nullable: true
          enum: [男, 女, 其他]
        city:
          type: string
          nullable: true
          description: 所在城市，1–40 字
        school:
          type: string
          nullable: true
          description: 学校，选填；≤80 字
        major:
          type: string
          nullable: true
          description: 专业，选填；≤80 字
        job:
          type: string
          nullable: true
          enum: [学生, 上班族, 自由职业, 其他]
        mbti:
          type: string
          nullable: true
          enum:
            [INTJ, INTP, ENTJ, ENTP, INFJ, INFP, ENFJ, ENFP,
             ISTJ, ISFJ, ESTJ, ESFJ, ISTP, ISFP, ESTP, ESFP]
        interests:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 12
          description: 旅行兴趣，3–5 个
        travel_style:
          type: string
          nullable: true
          enum: [特种兵, 休闲游, 深度游, 随性游]
        bio:
          type: string
          nullable: true
          maxLength: 500
        profile_complete:
          type: boolean
          readOnly: true
          description: 六项必填同时成立时为 true；NULL / 空串 / 非法日期都算缺失
    UserProfileUpdateRequest:
      type: object
      required: [nickname, birthday, gender, city, interests, travel_style]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        birthday:
          type: string
          format: date
          description: '`YYYY-MM-DD`，合法日期且 1900-01-01 ≤ d ≤ 今天'
        gender:
          type: string
          enum: [男, 女, 其他]
        city:
          type: string
          minLength: 1
          maxLength: 40
        school:
          type: string
          maxLength: 80
          description: 选填
        major:
          type: string
          maxLength: 80
          description: 选填
        job:
          type: string
          enum: [学生, 上班族, 自由职业, 其他]
          description: 选填
        mbti:
          type: string
          enum:
            [INTJ, INTP, ENTJ, ENTP, INFJ, INFP, ENFJ, ENFP,
             ISTJ, ISFJ, ESTJ, ESFJ, ISTP, ISFP, ESTP, ESFP]
          description: 选填
        interests:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 12
          description: 必填；3–5 个，去重后保存
        travel_style:
          type: string
          enum: [特种兵, 休闲游, 深度游, 随性游]
        bio:
          type: string
          maxLength: 500
          description: 选填
    AuthRegisterRequest:
      type: object
      required: [username, password, nickname]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_]+$'
          description: 登录用户名；不区分大小写，唯一
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: 明文密码只用于注册请求，服务端只保存加盐散列
        nickname:
          type: string
          minLength: 1
          maxLength: 20
          description: 昵称；注册后进入资料完善页补全其余必填字段
    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthSession:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          readOnly: true
          description: 不透明会话 token，作为 Authorization 头的 Bearer 凭据使用
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: 过期时间，UTC；默认签发后 7 天
        user:
          $ref: '#/components/schemas/DemoUser'
    TripPlan:
      type: object
      required:
        [id, title, destination, start_date, end_date, stops, tags, capacity, joined_count, status, publisher, created_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
          maxLength: 40
        destination:
          type: string
          maxLength: 40
          description: 目的地名称，来自离线地图地点库（城市或可搜索的地点）
        start_date:
          type: string
          format: date
          description: 出发日期（日历日期）
        end_date:
          type: string
          format: date
          description: 结束日期（日历日期，不早于 start_date）
        stops:
          type: array
          minItems: 2
          items:
            type: string
          description: 途经点，至少两个
        tags:
          type: array
          maxItems: 5
          items:
            type: string
        capacity:
          type: integer
          minimum: 2
          maximum: 12
          description: 计划人数，含发布者
        joined_count:
          type: integer
          minimum: 1
          readOnly: true
          description: 已加入人数，含发布者；由 trip-plans 维护
        status:
          type: string
          enum: [recruiting, full, completed]
          readOnly: true
          description: 由 completed_at 与人数推导，不是独立写入的列
        publisher:
          $ref: '#/components/schemas/DemoUser'
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: 创建时间，UTC
    TripDetail:
      allOf:
        - $ref: '#/components/schemas/TripPlan'
        - type: object
          required: [participants]
          properties:
            meeting_area:
              type: string
              nullable: true
              description: 集合区域，选填
            note:
              type: string
              nullable: true
              description: 补充说明，选填
            budget_min_cents:
              type: integer
              nullable: true
              minimum: 0
              description: 预算下限，整数分
            budget_max_cents:
              type: integer
              nullable: true
              minimum: 0
              description: 预算上限，整数分，不高于下限
            participants:
              type: array
              readOnly: true
              items:
                $ref: '#/components/schemas/DemoUser'
              description: 当前同行者；MVP 只含发布者，REQ-003 落地后补已接受同行者
            completed_at:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: 结束时间；非空表示已结束
    TripCreateRequest:
      type: object
      required: [title, destination_code, start_date, end_date, stops, capacity]
      properties:
        title:
          type: string
          maxLength: 40
        destination_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 目的地二级行政区划代码（必须选到市，含港澳台二级区）；名称由后端按字典生成
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        stops:
          type: array
          minItems: 2
          items:
            type: string
        meeting_area:
          type: string
          maxLength: 100
        budget_min_cents:
          type: integer
          minimum: 0
        budget_max_cents:
          type: integer
          minimum: 0
        tags:
          type: array
          maxItems: 5
          items:
            type: string
        capacity:
          type: integer
          minimum: 2
          maximum: 12
        note:
          type: string
          maxLength: 500
    Match:
      type: object
      required: [score, percentage, reasons, basis]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            type: string
        basis:
          type: string
          description: 参照物说明（最近一条未结束的已发布行程，或我的兴趣与当前筛选）
    MatchCandidate:
      type: object
      required: [trip, match]
      properties:
        trip:
          $ref: '#/components/schemas/TripPlan'
        match:
          $ref: '#/components/schemas/Match'
    TripPage:
      type: object
      required: [items, page, size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripPlan'
          description: 当前页的行程
        page:
          type: integer
          minimum: 1
          description: 当前页码，从 1 起
        size:
          type: integer
          minimum: 1
          maximum: 50
          description: 每页条数
        total:
          type: integer
          format: int64
          minimum: 0
          description: 筛选后的命中总数，不是全量行程数
        total_pages:
          type: integer
          minimum: 0
          description: 命中总数按 size 向上取整的页数
    MatchPage:
      type: object
      required: [items, page, size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          format: int64
          minimum: 0
          description: 筛选后的候选总数
        total_pages:
          type: integer
          minimum: 0
    ApplicationCreateRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 120
          nullable: true
          description: 选填的一句申请说明，未填时对方看到「未填写申请说明」
    TripApplication:
      type: object
      required: [id, trip_id, applicant, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        trip_id:
          type: integer
          format: int64
          readOnly: true
        applicant:
          $ref: '#/components/schemas/DemoUser'
        message:
          type: string
          maxLength: 120
          nullable: true
        status:
          type: string
          enum: [pending, accepted, rejected, cancelled]
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        trip:
          $ref: '#/components/schemas/TripPlan'
    ChatMessage:
      type: object
      required: [id, trip_id, sender_id, receiver_id, content, sent_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        trip_id:
          type: integer
          format: int64
          readOnly: true
        sender_id:
          type: integer
          format: int64
          readOnly: true
        receiver_id:
          type: integer
          format: int64
          readOnly: true
        content:
          type: string
          maxLength: 500
        sent_at:
          type: string
          format: date-time
          readOnly: true
    ChatMessageRequest:
      type: object
      required: [receiver_id, content]
      properties:
        receiver_id:
          type: integer
          format: int64
        content:
          type: string
          maxLength: 500
    ChatPartner:
      type: object
      required: [trip, other, message_count]
      properties:
        trip:
          $ref: '#/components/schemas/TripPlan'
        other:
          $ref: '#/components/schemas/DemoUser'
        last_message:
          $ref: '#/components/schemas/ChatMessage'
        message_count:
          type: integer
          minimum: 0
    MyTrips:
      type: object
      required: [published, applied, matched, completed, pending_application_count]
      properties:
        published:
          type: array
          items:
            $ref: '#/components/schemas/TripPlan'
        applied:
          type: array
          items:
            $ref: '#/components/schemas/TripApplication'
        matched:
          type: array
          items:
            $ref: '#/components/schemas/TripPlan'
        completed:
          type: array
          items:
            $ref: '#/components/schemas/TripPlan'
        pending_application_count:
          type: integer
          minimum: 0
    ExperienceWriteRequest:
      type: object
      required: [content, intensity, advice]
      properties:
        content:
          type: string
          minLength: 10
          maxLength: 400
          description: 真实感受，去空白后 10–400 字
        intensity:
          type: string
          enum: [relaxed, moderate, tiring]
          description: 路线强度
        advice:
          type: string
          minLength: 1
          maxLength: 120
          description: 给后来者的一条建议
    Experience:
      type: object
      required: [id, trip, author, content, intensity, advice, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        trip:
          $ref: '#/components/schemas/TripPlan'
        author:
          $ref: '#/components/schemas/DemoUser'
        content:
          type: string
          maxLength: 400
        intensity:
          type: string
          enum: [relaxed, moderate, tiring]
        advice:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ExperiencePage:
      type: object
      required: [items, page, size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Experience'
          description: 当前页的游后体验
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          format: int64
          minimum: 0
          description: 筛选后的体验总数
        total_pages:
          type: integer
          minimum: 0
    ReportRequest:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type:
          type: string
          enum: [trip, user]
        target_id:
          type: integer
          format: int64
        reason:
          type: string
          enum: [harassment, fake, safety, other]
        note:
          type: string
          maxLength: 200
          nullable: true
    ReportReceipt:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          readOnly: true
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 大写下划线错误码，前端按原值判断
          enum:
            [GREETING_NOT_FOUND, INVALID_INPUT, DEMO_USER_REQUIRED, FORBIDDEN, USER_NOT_FOUND, TRIP_NOT_FOUND, TRIP_NOT_OPEN,
             APPLICATION_NOT_FOUND, APPLICATION_NOT_PENDING, DUPLICATE_APPLICATION, CHAT_NOT_ALLOWED, CHAT_READ_ONLY,
             EXPERIENCE_NOT_ALLOWED, USERNAME_TAKEN, INVALID_CREDENTIALS, SESSION_INVALID, INTERNAL_ERROR]
        fields:
          type: object
          description: |
            仅资料校验失败（400 `INVALID_INPUT`）时出现：字段名 → 原因码。
            其他错误不携带该键。
          additionalProperties:
            type: string
            enum:
              [REQUIRED, TOO_LONG, INVALID_DATE, OUT_OF_RANGE, TOO_FEW, TOO_MANY, DUPLICATE, INVALID_OPTION]
