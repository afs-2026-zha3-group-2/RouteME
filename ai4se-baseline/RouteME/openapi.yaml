      operationId: shareTripExperience
      summary: 发布或修改我的游后体验
      description: 仅已结束且自己参加过的行程；同一用户对同一行程只有一条体验，再次提交即修改。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
