openapi: 3.0.3
info:
  title: RouteME API
  version: 0.32.0
  description: |
    RouteME 后端对外契约。本文件是前后端唯一事实源，字段名、类型、状态码与错误码只在这里定稿。
        当前包含：脚手架问候语、演示账户与账号认证（注册/登录/会话/退出）、旅行计划（浏览/筛选/发布/详情/结束），同行匹配、申请、退出、聊天、我的旅行与举报，游后体验分享与参考发布所需数据，管理后台（用户管理 / 举报处置 / 人工客服）与用户侧帮助入口，AI 智能行程推荐（生成/快照保存与读取，天气复用目的地天气接口），以及目的地天气提醒与信用分账户、安全学习恢复信用分的考试会话与判分，旅行保障（演示钱包 / 保险 / 借款 / 还款），学信网学籍认证（演示核验）与核心动作门槛。
        行程与体验列表按页返回：`page` 从 1 起，`size` 默认 20、上限 50。
        目的地为用户在地图地点库中搜索或点选的城市/地点名称，不再限定固定枚举。
servers:
  - url: http://localhost:8080/api
    description: 本地开发
paths:
  /greeting:
    get:
      operationId: loadGreeting
      summary: 读取当前问候语
      description: |
        问候语是单例资源：greetings 表中只有一条记录，因此路径用单数名词。
        文本由 Flyway 迁移写入，接口只读。
      responses:
        '200':
          description: 当前问候语
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
              examples:
                seeded:
                  value:
                    id: 1
                    message: Hello World
        '404':
          description: greetings 表没有记录，问候语尚未写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: GREETING_NOT_FOUND
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /users:
    get:
      operationId: loadDemoUsers
      summary: 读取演示账户
      description: 身份门使用。演示环境固定 3 个账户，不做注册与鉴权。
      responses:
        '200':
          description: 演示账户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoUser'
              examples:
                seeded:
                  value:
                    - id: 1
                      nickname: 林见夏
                      avatar_initial: 夏
                      school: 大三 · 视觉传达
                      bio: 拍照比走路多。
                      interests: [摄影, 海边, 美食]
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /users/demo:
    get:
      operationId: loadDemoOnlyUsers
      summary: 读取演示账户
      description: 身份门使用。只返回没有用户名凭据的 3 个预设账户，注册账号不会出现在这里。
      responses:
        '200':
          description: 演示账户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoUser'
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /users/credits:
    get:
      operationId: loadUserCredits
      summary: 批量读取信用状态
      description: |
        需携带 `X-User-Id`。供行程卡、申请列表与详情页发布者行一次取数；
        `ids` 为逗号分隔的用户 id，最多 50 个；缺失信用账户的 id 按初始 80 分补齐。
        只返回分数与等级码，不含任何加 / 扣分明细。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: ids
          in: query
          required: true
          description: 逗号分隔的用户 id，最多 50 个
          schema:
            type: string
      responses:
        '200':
          description: 按请求顺序返回的信用状态
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCreditEntry'
              examples:
                seeded:
                  value:
                    - user_id: 1
                      credit_score: 80
                      credit_level: good
        '400':
          description: ids 缺失、非数字或超过 50 个
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '401':
          description: 缺失或未知的 X-User-Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: DEMO_USER_REQUIRED
  /users/growth:
    get:
      operationId: loadUserGrowthLevels
      summary: 批量读取用户成长等级
      description: |
        需携带 `X-User-Id`。供行程卡、申请列表与详情同行者一次取数；
        `ids` 为逗号分隔的用户 id，最多 50 个；只返回等级，不含经验值或流水。
        任一 id 不存在时返回 404 `USER_NOT_FOUND`，不创建孤立账户。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: ids
          in: query
          required: true
          description: 逗号分隔的用户 id，最多 50 个
          schema:
            type: string
      responses:
        '200':
          description: 按请求顺序返回的成长等级
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserGrowthEntry'
              examples:
                seeded:
                  value:
                    - user_id: 1
                      level: 1
        '400':
          description: ids 缺失、非数字或超过 50 个
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '401':
          description: 缺失或未知的 X-User-Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: DEMO_USER_REQUIRED
        '404':
          description: 任一用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: USER_NOT_FOUND
  /users/{userId}/profile:
    get:
      operationId: loadUserProfile
      summary: 读取个人资料
      description: |
        需携带 `X-User-Id`。本人读取时响应含 `birthday`；读取他人时省略该键，
        只返回派生的 `age` / `zodiac` 与公开字段，不会泄露完整生日。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: userId
          in: path
          required: true
          description: 资料所属用户 id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 公开资料（本人额外含生日）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                self:
                  value:
                    id: 4
                    nickname: 新同学
                    avatar_initial: 新
                    birthday: '2003-05-18'
                    age: 23
                    zodiac: 金牛
                    gender: 女
                    city: 珠海
                    school: 中山大学
                    major: 地理科学
                    interests: [摄影, 美食, 徒步]
                    travel_style: 休闲游
                    profile_complete: true
                    credit_score: 85
                    credit_level: good
                    credit_restricted: false
                    route_completion_state: insufficient
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          description: 目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: USER_NOT_FOUND
        '500':
          $ref: '#/components/responses/Unexpected'
  /users/me/profile:
    put:
      operationId: saveMyProfile
      summary: 保存本人资料
      description: |
        需要登录会话。全部必填字段通过校验后一次性覆盖保存；
        校验失败返回 400 `INVALID_INPUT` 与 `fields`（字段名 → 原因码），且不写入任何字段。
      parameters:
        - $ref: '#/components/parameters/BearerToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        '200':
          description: 保存后的资料，含生日
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 字段校验失败，`fields` 为字段名 → 原因码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingFields:
                  value:
                    code: INVALID_INPUT
                    fields:
                      birthday: REQUIRED
                      gender: REQUIRED
                      city: REQUIRED
                      interests: TOO_FEW
                      travel_style: REQUIRED
        '401':
          description: 缺少有效会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSession:
                  value:
                    code: SESSION_INVALID
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Unexpected'
  /users/me/avatar:
    post:
      operationId: uploadMyAvatar
      summary: 上传本人头像
      description: |
        只接受 JPEG / PNG / WebP（按魔数判定，不信任声明类型与原始文件名），单文件不超过 2 MB；
        文件名由服务端生成，响应返回带缓存版本的 `avatar_url`。
      parameters:
        - $ref: '#/components/parameters/BearerToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 含新头像地址的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: 缺少有效会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSession:
                  value:
                    code: SESSION_INVALID
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Unexpected'
  /users/me/student-verification:
    post:
      operationId: verifyStudentIdentity
      summary: 提交学信网学籍认证
      description: |
        需要登录会话。演示核验：姓名、院校与 12 位学信网在线验证码通过格式校验后即置为已认证，
        验证码不落库。认证是发布行程、申请同行、发送消息与分享体验的前置门槛；管理员账号豁免。
        重复提交会刷新认证院校与认证时间。
      parameters:
        - $ref: '#/components/parameters/BearerToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentVerificationRequest'
      responses:
        '200':
          description: 认证通过后的用户摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoUser'
        '400':
          description: 字段校验失败，`fields` 为字段名 → 原因码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCode:
                  value:
                    code: INVALID_INPUT
                    fields:
                      code: INVALID_OPTION
        '401':
          description: 缺少有效会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSession:
                  value:
                    code: SESSION_INVALID
        '500':
          $ref: '#/components/responses/Unexpected'
  /users/{userId}/avatar:
    get:
      operationId: loadUserAvatar
      summary: 读取用户头像
      description: |
        公开只读图片端点：`<img>` 无法携带请求头。总是返回当前头像文件并忽略 `v` 参数；
        缓存一年且标记 immutable，换头像时 `avatar_url` 的版本参数随之变化。
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 当前头像图片
          headers:
            Cache-Control:
              description: '`public, max-age=31536000, immutable`'
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: 用户不存在或尚未上传头像
  /auth/register:
    post:
      operationId: registerAccount
      summary: 注册账号并自动登录
      description: |
        用户名不区分大小写、唯一；密码以 PBKDF2-HMAC-SHA256 加盐散列保存。
        注册成功即签发会话，前端可直接进入首页。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: 账号已创建并登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: 用户名/密码/昵称等字段不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '409':
          description: 用户名已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                taken:
                  value:
                    code: USERNAME_TAKEN
  /auth/login:
    post:
      operationId: loginAccount
      summary: 用户名密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: 请求体缺少用户名或密码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '401':
          description: 用户名不存在、密码错误，或演示账户没有密码凭据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: INVALID_CREDENTIALS
  /auth/me:
    get:
      operationId: loadSessionUser
      summary: 读取当前登录用户
      parameters:
        - $ref: '#/components/parameters/BearerToken'
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoUser'
        '401':
          description: token 缺失、不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSession:
                  value:
                    code: SESSION_INVALID
  /auth/logout:
    post:
      operationId: logoutAccount
      summary: 退出登录
      description: 删除当前 token；重复退出仍返回 204。
      parameters:
        - $ref: '#/components/parameters/BearerToken'
      responses:
        '204':
          description: 会话已删除
        '401':
          description: token 缺失或无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSession:
                  value:
                    code: SESSION_INVALID
  /trips:
    get:
      operationId: loadTrips
      summary: 浏览未结束的旅行计划
      description: |
        只返回未结束（completed_at 为空）的行程；已结束与已取消不在列表中。
        结果为分页对象：`total` 是筛选后的命中总数，`total_pages` 为向上取整的页数。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: destination_code
          in: query
          description: 目的地 6 位行政区划代码（二级，必须选到市）
          schema:
            type: string
            pattern: '^[0-9]{6}$'
            example: '440400'
        - name: date_from
          in: query
          description: 出发不早于（与行程日期区间取交集）
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: 出发不晚于（与行程日期区间取交集）
          schema:
            type: string
            format: date
        - name: tags
          in: query
          description: 兴趣标签，逗号分隔，命中任一即保留
          schema:
            type: string
      responses:
        '200':
          description: 未结束行程的一页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
              examples:
                filtered:
                  value:
                    items:
                      - id: 3
                        title: 珠海情侣路日落机位二刷
                        destination: 珠海市
                        destination_code: '440400'
                        province_code: '440000'
                        province_name: 广东省
                        start_date: '2026-11-16'
                        end_date: '2026-11-16'
                        stops: [香洲港集合, 情侣北路步行, 海滨泳场日落]
                        tags: [摄影, 海边]
                        capacity: 3
                        joined_count: 1
                        status: recruiting
                        publisher:
                          id: 2
                          nickname: 陈屿
                          avatar_initial: 屿
                          school: 研一 · 地理科学
                          bio: 周末基本在山里。
                          interests: [徒步, 自然, 露营]
                        created_at: '2026-11-12T14:05:00Z'
                    page: 1
                    size: 20
                    total: 1
                    total_pages: 1
        '400':
          description: 查询参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '401':
          description: 缺少或未知的演示身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: DEMO_USER_REQUIRED
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
    post:
      operationId: createTrip
      summary: 发布旅行计划
      description: |
        必填与约束见 TripCreateRequest。目的地只接受二级行政区划代码；名称由后端按字典生成（直辖市取省级名）。
        发布成功后状态为 recruiting，joined_count 计入发布者本人。
        字段级提示由前端表单给出；后端校验失败（含省级代码、字典中不存在的代码）统一返回 400 INVALID_INPUT。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreateRequest'
            examples:
              success:
                value:
                  title: 广州老城骑楼扫街半日
                  destination: 广州市
                  destination_code: '440100'
                  province_code: '440000'
                  province_name: 广东省
                  start_date: '2026-11-16'
                  end_date: '2026-11-16'
                  stops: [陈家祠地铁站集合, 恩宁路骑楼, 永庆坊]
                  meeting_areas: [陈家祠地铁站 D 口]
                  budget_min_cents: 8000
                  budget_max_cents: 15000
                  tags: [摄影, 历史, 美食]
                  capacity: 4
                  note: 走街串巷为主，随时可以停下来吃东西。
              rejected:
                value:
                  title: ''
                  destination: 广州市
                  destination_code: '440100'
                  province_code: '440000'
                  province_name: 广东省
                  start_date: '2026-11-16'
                  end_date: '2026-11-15'
                  stops: [只有一处]
                  capacity: 1
      responses:
        '201':
          description: 发布成功，返回行程详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '400':
          description: 必填缺失或约束不满足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '401':
          description: 缺少或未知的演示身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: DEMO_USER_REQUIRED
