          maximum: 2
        exam_limit:
          type: integer
          readOnly: true
          description: 每自然月考试次数上限
          enum: [2]
        month:
          type: string
          readOnly: true
          description: 北京时间自然月 `YYYY-MM`，与恢复幂等键同源
          pattern: '^[0-9]{4}-[0-9]{2}$'
        learning_completed:
          type: boolean
          readOnly: true
          description: 本次学习内容是否已完成；未完成时提交作答返回 409
    LearningAnswerDetail:
      type: object
      required: [question_id, correct]
      properties:
        question_id:
          type: string
          readOnly: true
          description: 题目编号，对应下发的 `questions[i].id`
        correct:
          type: boolean
          readOnly: true
          description: 该题是否答对；正确答案不下发
    LearningResult:
      type: object
      required: [session_id, passed, score, pass_line, details, recovery_applied, credit_score, credit_level]
      properties:
        session_id:
          type: integer
          format: int64
          readOnly: true
          description: 考试会话标识
        passed:
          type: boolean
          readOnly: true
          description: 是否通过（答对题数不小于 `pass_line`）
        score:
          type: integer
          readOnly: true
          description: 本次答对题数
          minimum: 0
          maximum: 10
        pass_line:
          type: integer
          readOnly: true
          description: 通过线
          enum: [8]
        details:
          type: array
          readOnly: true
          description: 逐题对错，顺序与提交的作答一致
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/LearningAnswerDetail'
        recovery_applied:
          type: boolean
          readOnly: true
          description: 本次请求是否把分数改到 60；并发下可能为 false，前端不重复播报
        credit_score:
          type: integer
          readOnly: true
          description: 判分后的当前信用分
          minimum: 0
          maximum: 100
        credit_level:
          type: string
          readOnly: true
          description: 判分后的当前等级（与 `UserProfile.credit_level` 同口径）
          enum: [excellent, good, fair, low, risk]

    Wallet:
      type: object
      required: [balance_cents]
      properties:
        balance_cents:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: 当前余额，整数分（CNY）
    WalletLedgerEntry:
      type: object
      required:
        [id, direction, amount_cents, balance_before_cents, balance_after_cents, entry_type, related_type,
         related_id, occurred_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        direction:
          type: string
          enum: [credit, debit]
          readOnly: true
          description: credit 为入账，debit 为出账
        amount_cents:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: 变动金额，整数分（CNY）
        balance_before_cents:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
        balance_after_cents:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
        entry_type:
          type: string
          enum: [loan_disbursement, loan_repayment]
          readOnly: true
          description: 业务类型；保险由第三方收取，不产生钱包流水
        related_type:
          type: string
          enum: [travel_loan]
          readOnly: true
        related_id:
          type: string
          readOnly: true
          description: 关联业务主键，字符串形式
        occurred_at:
          type: string
          format: date-time
          readOnly: true
          description: 发生时刻（UTC）
    InsurancePolicy:
      type: object
      required: [id, trip_id, provider, coverage_start, coverage_end, status, confirmed_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        trip_id:
          type: integer
          format: int64
          readOnly: true
        provider:
          type: string
          readOnly: true
          description: 实际保险服务提供方名称；承保、理赔与免责以该提供方条款为准
        coverage_start:
          type: string
          format: date
          readOnly: true
          description: 保障起始日（含），取行程出发日
        coverage_end:
          type: string
          format: date
          readOnly: true
          description: 保障结束日（含），取行程结束日
        status:
          type: string
          enum: [active, expired]
          readOnly: true
          description: 保障结束日之后只读派生为 expired，不落库也不删除记录
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          description: 第三方确认投保的回写时刻（UTC）
    InsuranceProvider:
      type: object
      required: [name, policy_url, claim_url, emergency_url]
      properties:
        name:
          type: string
          readOnly: true
          description: 实际保险服务提供方名称
        policy_url:
          type: string
          readOnly: true
          description: 查看保单入口
        claim_url:
          type: string
          readOnly: true
          description: 理赔指引入口
        emergency_url:
          type: string
          readOnly: true
          description: 紧急求助入口
    InsuranceProduct:
      type: object
      required: [code, title, summary]
      properties:
        code:
          type: string
          enum: [accident_medical, emergency_rescue, travel_baggage]
          readOnly: true
          description: 第三方保障类别编码
        title:
          type: string
          readOnly: true
          description: 保障类别名称
        summary:
          type: string
          readOnly: true
          description: 保障范围摘要；具体保额、免赔与免责以第三方条款为准
    InsuranceSummary:
      type: object
      required: [status, provider, products, purchase_url, policy]
      properties:
        status:
          type: string
          enum: [not_purchased, active, expired]
          readOnly: true
          description: 未购买 / 保障中 / 已结束；已结束由保障结束日派生
        provider:
          $ref: '#/components/schemas/InsuranceProvider'
        products:
          type: array
          readOnly: true
          description: 第三方提供的保障类别，不含价格与保额
          items:
            $ref: '#/components/schemas/InsuranceProduct'
        purchase_url:
          type: string
          nullable: true
          readOnly: true
          description: 第三方投保入口；当前用户无资格时为 null
        policy:
          $ref: '#/components/schemas/InsurancePolicy'
          nullable: true
    InsuranceRedirect:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          readOnly: true
          description: 第三方投保地址；RouteMe 不在此步骤扣款或生成保单
    TravelLoan:
      type: object
      required:
        [id, trip_id, principal_cents, service_fee_cents, disbursed_cents, interest_cents, repay_cents,
         penalty_cents, total_repay_cents, term_days, status, funded_at, due_at, repaid_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        trip_id:
          type: integer
          format: int64
          readOnly: true
        principal_cents:
          type: integer
          format: int32
          readOnly: true
          description: 本金，整数分（CNY）
        service_fee_cents:
          type: integer
          format: int32
          readOnly: true
          description: 服务费 = 本金 × 5%，从本金扣除，整数分（CNY）
        disbursed_cents:
          type: integer
          format: int32
          readOnly: true
          description: 发放净额 = 本金 − 服务费，整数分（CNY）
        interest_cents:
          type: integer
          format: int32
          readOnly: true
          description: 利息 = 本金 × 0.05%/日 × 期限天数，四舍五入到分（CNY）
        repay_cents:
          type: integer
          format: int32
          readOnly: true
          description: 应还金额 = 本金 + 利息，不含逾期罚息，整数分（CNY）
        penalty_cents:
          type: integer
          format: int32
          readOnly: true
          description: 逾期罚息 = 本金 × 0.1%/日 × 已开始逾期天数；未逾期或已结清且未逾期时为 0
        total_repay_cents:
          type: integer
          format: int32
          readOnly: true
          description: 本次还款合计 = 应还金额 + 当前应计逾期罚息，整数分（CNY）
        term_days:
          type: integer
          enum: [7, 14, 30]
          readOnly: true
        status:
          type: string
          enum: [active, repaid, overdue]
          readOnly: true
          description: overdue 由「ACTIVE 且已过 due_at」只读派生，不落库
        funded_at:
          type: string
          format: date-time
          readOnly: true
          description: 发放时刻（UTC）
        due_at:
          type: string
          format: date-time
          readOnly: true
          description: 到期时刻（UTC）= 发放时刻 + 期限天数
        repaid_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 还款时刻（UTC）；未还清时为 null
    TripFinance:
      type: object
      required:
        [trip_id, trip_title, destination, trip_status, start_date, end_date, companion_count, is_eligible,
         ineligible_reason, wallet, insurance, loans]
      properties:
        trip_id:
          type: integer
          format: int64
          readOnly: true
        trip_title:
          type: string
          readOnly: true
        destination:
          type: string
          readOnly: true
          description: 行程目的地城市
        trip_status:
          type: string
          enum: [recruiting, full, ongoing, completed, cancelled]
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        companion_count:
          type: integer
          format: int32
          minimum: 0
          readOnly: true
          description: 已加入的同行人数（不含发布者本人）
        is_eligible:
          type: boolean
          readOnly: true
          description: 当前用户是否为发布者或 ACCEPTED 同行者，且行程可交易
        ineligible_reason:
          type: string
          enum: [not_participant, trip_closed]
          nullable: true
          readOnly: true
          description: 无资格原因；is_eligible 为 true 时为 null
        wallet:
          $ref: '#/components/schemas/Wallet'
        insurance:
          $ref: '#/components/schemas/InsuranceSummary'
        loans:
          type: array
          readOnly: true
          description: 当前用户在该行程下的借款
          items:
            $ref: '#/components/schemas/TravelLoan'
    MyFinance:
      type: object
      required: [wallet, ledger, policies, loans]
      properties:
        wallet:
          $ref: '#/components/schemas/Wallet'
        ledger:
          type: array
          readOnly: true
          description: 按 occurred_at 升序（同刻按 id 升序），可顺序回算余额
          items:
            $ref: '#/components/schemas/WalletLedgerEntry'
        policies:
          type: array
          readOnly: true
          description: 当前用户的全部第三方保险状态，按回写时间倒序
          items:
            $ref: '#/components/schemas/InsurancePolicy'
        loans:
          type: array
          readOnly: true
          description: 当前用户的全部借款，按发放时间倒序
          items:
            $ref: '#/components/schemas/TravelLoan'
    LoanCreateRequest:
      type: object
      required: [principal_cents, term_days]
      properties:
        principal_cents:
          type: integer
          format: int32
          minimum: 10000
          maximum: 200000
          multipleOf: 100
          description: 本金，整数分（CNY）；必须为 100 的倍数（整元）
        term_days:
          type: integer
          enum: [7, 14, 30]
          description: 借款期限（天）
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 大写下划线错误码，前端按原值判断
          enum:
            [GREETING_NOT_FOUND, INVALID_INPUT, DEMO_USER_REQUIRED, FORBIDDEN, USER_NOT_FOUND, TRIP_NOT_FOUND, TRIP_NOT_OPEN,
             APPLICATION_NOT_FOUND, APPLICATION_NOT_PENDING, DUPLICATE_APPLICATION, CHAT_NOT_ALLOWED, CHAT_READ_ONLY,
             EXPERIENCE_NOT_ALLOWED, EXPERIENCE_NOT_FOUND, USERNAME_TAKEN, INVALID_CREDENTIALS, SESSION_INVALID, WEATHER_UPSTREAM_ERROR,
             AI_NOT_CONFIGURED, AI_UPSTREAM_ERROR, AI_INVALID_OUTPUT, INTERNAL_ERROR, ADMIN_REQUIRED, ACCOUNT_SUSPENDED,
             ACCOUNT_BANNED, INVALID_STATUS_TRANSITION, CANNOT_TARGET_SELF, REPORT_NOT_FOUND, REPORT_NOT_PENDING,
             REPORT_NOT_PROCESSING, EMAIL_TAKEN, SESSION_ALREADY_HANDLING, SESSION_NOT_HANDLING, SESSION_CLOSED,
             CREDIT_RESTRICTED, LEARNING_NOT_ELIGIBLE, LEARNING_EXAM_QUOTA_EXCEEDED, LEARNING_RECOVERY_QUOTA_EXCEEDED,
             LEARNING_NOT_COMPLETED, LEARNING_SESSION_NOT_FOUND, LEAVE_RECORD_NOT_FOUND, NOTIFICATION_NOT_FOUND,
             INSUFFICIENT_BALANCE, ACTIVE_LOAN_EXISTS, LOAN_NOT_ACTIVE, STUDENT_VERIFICATION_REQUIRED]
        fields:
          type: object
          description: |
            仅资料校验与学信网认证校验失败（400 `INVALID_INPUT`）时出现：字段名 → 原因码。
            其他错误不携带该键。
          additionalProperties:
            type: string
            enum:
              [REQUIRED, TOO_LONG, INVALID_DATE, OUT_OF_RANGE, TOO_FEW, TOO_MANY, DUPLICATE, INVALID_OPTION]

    MyReport:
      type: object
      required: [id, code, target_type, reason, status, created_at]
      description: 举报人视角的举报；不含管理员备注、处理人 id 与他人的处罚细节
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        code:
          type: string
          readOnly: true
          description: 举报编号，形如 `R-42`
        target_type:
          type: string
          enum: [trip, user, experience]
        reason:
          type: string
          enum: [harassment, fake, safety, other]
        status:
          $ref: '#/components/schemas/ReportStatus'
        created_at:
          type: string
          format: date-time
          readOnly: true
        processing_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    NotificationType:
      type: string
      description: 通知业务域类型；wire 值固定，前端按原值分组与计数
      enum: [TRIP, APPLICATION, CHAT, CREDIT, REPORT, ACCOUNT, SERVICE, SYSTEM]
    NotificationEventName:
      type: string
      description: 类型下的具体事件；wire 值固定，前端只做展示与断言
      enum:
        - trip_full
        - trip_ongoing
        - trip_cancelled
        - trip_completed
        - application_received
        - application_accepted
        - application_rejected
        - application_closed
        - message
        - credit_changed
        - credit_recovered
        - report_submitted
        - report_processing
        - report_resolved
        - account_suspended
        - account_banned
        - account_restored
        - service_joined
        - service_reply
        - service_closed
        - safety_reminder
        - identity_verified
    NotificationPriority:
      type: string
      description: 优先级；信用分低于 60 等需要立即关注的事件为 HIGH
      enum: [NORMAL, HIGH]
    NotificationStatus:
      type: string
      description: 状态由 `read_at` 派生；READ 不再计入未读
      enum: [UNREAD, READ]
    NotificationTargetKind:
      type: string
      description: 跳转目标种类；前端按 kind 组装路由
      enum: [trip, applications, chat, credit, report, account, support, identity]
    NotificationTarget:
      type: object
      required: [kind]
      description: 跳转定位字段；与 kind 无关的字段为 null
      properties:
        kind:
          $ref: '#/components/schemas/NotificationTargetKind'
        trip_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
        other_user_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
          description: 仅 `kind=chat`，会话另一方 id
        application_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
        report_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
        session_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
    Notification:
      type: object
      required:
        [id, type, event, title, content, priority, status, created_at, target, related_available]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        type:
          $ref: '#/components/schemas/NotificationType'
        event:
          $ref: '#/components/schemas/NotificationEventName'
        title:
          type: string
          readOnly: true
          description: 后端生成的标题，唯一来源是后端通知文案函数
        content:
          type: string
          readOnly: true
          description: |
            后端生成的正文，含取消原因 / 分数变化 / 恢复时间等业务事实；
            不含管理员自由文本备注或他人的隐私信息
        priority:
          $ref: '#/components/schemas/NotificationPriority'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        actor:
          type: object
          allOf:
            - $ref: '#/components/schemas/DemoUser'
          nullable: true
          description: 动作人；系统 / 信用 / 客服 / 认证类通知为 null
        trip_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
        trip_title:
          type: string
          nullable: true
          readOnly: true
        application_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
        message_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
        report_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
        session_id:
          type: integer
          format: int64
          nullable: true
          readOnly: true
        target:
          $ref: '#/components/schemas/NotificationTarget'
        related_available:
          type: boolean
          readOnly: true
          description: |
            关联业务当前是否仍可访问。false 时通知内容照常展示，
            前端提示「相关内容当前不可查看」而不是报错
    NotificationCounts:
      type: object
      required: [total, by_type]
      properties:
        total:
          type: integer
          minimum: 0
          readOnly: true
        by_type:
          type: object
          description: 按八类拆分的未读计数；八类始终齐备，零值不省略
          required: [TRIP, APPLICATION, CHAT, CREDIT, REPORT, ACCOUNT, SERVICE, SYSTEM]
          additionalProperties: false
          properties:
            TRIP:
              type: integer
              minimum: 0
            APPLICATION:
              type: integer
              minimum: 0
            CHAT:
              type: integer
              minimum: 0
            CREDIT:
              type: integer
              minimum: 0
            REPORT:
              type: integer
              minimum: 0
            ACCOUNT:
              type: integer
              minimum: 0
            SERVICE:
              type: integer
              minimum: 0
            SYSTEM:
              type: integer
              minimum: 0
    NotificationList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Notification'
        counts:
          $ref: '#/components/schemas/NotificationCounts'
    NotificationReadRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [all, conversation]
        trip_id:
          type: integer
          format: int64
          nullable: true
          description: 仅 `scope=conversation` 使用；与 `other_user_id` 同时必填
        other_user_id:
          type: integer
          format: int64
          nullable: true
          description: 仅 `scope=conversation` 使用；与 `trip_id` 同时必填
    NotificationEvent:
      type: object
      required: [notification]
      properties:
        notification:
          $ref: '#/components/schemas/Notification'
        message:
          type: object
          allOf:
            - $ref: '#/components/schemas/ChatMessage'
          nullable: true
          description: 仅 `type=CHAT` 的推送出现，内容为刚保存的消息
