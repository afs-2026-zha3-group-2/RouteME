        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
  /trips/{tripId}/experiences/photos:
    post:
      operationId: uploadTripExperiencePhoto
      summary: 上传游后体验图片
      description: |
        只能为已结束且自己参加过的行程上传；只接受 JPEG / PNG / WebP（按魔数判定，不信任声明类型与原始文件名），
        单张不超过 5 MB；同一用户对同一行程最多 6 张（含已绑定与未绑定，第 7 张返回 400）。
        上传成功返回未绑定的图片引用，随后随体验提交按 `photo_ids` 顺序绑定；
        文件名由服务端生成，上传时剥离全部 EXIF 元数据。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 已保存的图片引用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperiencePhoto'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          description: 行程未结束或当前用户不具备分享资格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notAllowed:
                  value:
                    code: EXPERIENCE_NOT_ALLOWED
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
  /experience-photos/{photoId}:
    get:
      operationId: loadExperiencePhoto
      summary: 读取游后体验图片
      description: |
        公开只读图片端点；返回服务端保存的原图（已剥离 EXIF）。
        缓存一天且不标记 immutable：图片被移除后服务端返回 404，浏览器缓存最多一天内自然失效。
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 体验图片
          headers:
            Cache-Control:
              description: '`public, max-age=86400`'
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: 图片不存在或已被移除
