      description: |
        返回行程基础信息（目的地、出发 / 结束日期、同行人数）、当前用户是否有资格使用保险入口、
        自己的钱包、第三方保险摘要与该行程下的借款。非同行者或已结束 / 已取消行程返回 200 +
        `is_eligible=false` 与 `ineligible_reason`，此时 `insurance.purchase_url` 为 null；
        不返回任何他人数据，是否可提交仍由写端点二次校验。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 行程维度的钱包、第三方保险摘要与借款
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripFinance'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
  /trips/{tripId}/insurance/purchase:
    post:
      operationId: openInsurancePurchase
      summary: 前往第三方投保
      description: |
        仅行程发布者或 `ACCEPTED` 同行者、且行程状态为 recruiting / full / ongoing 时可打开；
        账号必须为 `ACTIVE`。RouteMe 不设计保险产品、不计算保费、不承保，
        只返回服务端配置的第三方投保地址（附带 `trip_id`）。
        本步骤不扣款、不写保单、不产生钱包流水；实际投保与支付在第三方完成。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 第三方投保地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsuranceRedirect'
              examples:
                demo:
                  value:
                    redirect_url: 'https://example.com/routeme/insurance/purchase?trip_id=3'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/FinanceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 行程不可交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tripNotOpen:
                  value:
                    code: TRIP_NOT_OPEN
        '500':
          $ref: '#/components/responses/Unexpected'
  /trips/{tripId}/insurance/confirm:
    post:
      operationId: confirmInsurance
      summary: 回写第三方投保结果
      description: |
        第三方确认投保完成后回写：保障期取行程出发日与结束日，状态写为 `ACTIVE`。
        同一用户在同一行程幂等，重复调用返回同一条记录；不扣款、不产生钱包流水。
        不接收也不保存保单号、身份证号、银行卡号等投保敏感信息；
        保障结束日之后状态只读派生为 `expired`，不会迁移或删除记录。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已回写的保险状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsurancePolicy'
              examples:
                active:
                  value:
                    id: 1
                    trip_id: 3
                    provider: 第三方保险机构
                    coverage_start: '2026-11-16'
                    coverage_end: '2026-11-16'
                    status: active
                    confirmed_at: '2026-11-16T09:00:00Z'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/FinanceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 行程不可交易
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tripNotOpen:
                  value:
                    code: TRIP_NOT_OPEN
        '500':
          $ref: '#/components/responses/Unexpected'
  /trips/{tripId}/loans:
    post:
      operationId: createTravelLoan
      summary: 申请旅行借款
      description: |
        本金为 10,000–200,000 分（100–2,000 元）的整元金额，期限仅 7 / 14 / 30 天；
        服务费为本金 5% 并从本金扣除，发放净额 = 本金 − 服务费；
        利息 = 本金 × 0.05% × 期限天数，应还金额 = 本金 + 利息（逾期罚息另计）。
        到期时刻由服务端按「发放时刻 + 期限」计算，客户端 `due_at` 被忽略。
        每个用户同一时刻最多一笔 `ACTIVE` 借款。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanCreateRequest'
            examples:
              thousandFourteenDays:
                value:
                  principal_cents: 100000
                  term_days: 14
      responses:
        '201':
          description: 已发放借款并入账净额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelLoan'
              examples:
                thousandFourteenDays:
                  value:
                    id: 1
                    trip_id: 3
                    principal_cents: 100000
                    service_fee_cents: 5000
                    disbursed_cents: 95000
                    interest_cents: 700
                    repay_cents: 100700
                    penalty_cents: 0
                    total_repay_cents: 100700
                    term_days: 14
                    status: active
                    funded_at: '2026-11-16T09:00:00Z'
                    due_at: '2026-11-30T09:00:00Z'
                    repaid_at: null
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/FinanceForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 行程不可交易或已有进行中借款
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tripNotOpen:
                  value:
                    code: TRIP_NOT_OPEN
                activeLoanExists:
                  value:
                    code: ACTIVE_LOAN_EXISTS
        '500':
          $ref: '#/components/responses/Unexpected'
  /me/finance:
    get:
      operationId: loadMyFinance
      summary: 账号维度旅行保障聚合
      description: |
        当前用户的钱包、全部流水、全部第三方保险状态与全部借款。流水按 `occurred_at` 升序
        （同刻按 `id` 升序）返回，可按「初始余额 + 入账 − 出账」顺序回算；
        保险确认不产生流水。列表只含当前用户自己的记录，演示阶段不分页。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      responses:
        '200':
          description: 钱包、流水、保险状态与借款
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFinance'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /loans/{loanId}/repay:
    post:
      operationId: repayTravelLoan
      summary: 手动全额还清借款
      description: |
        仅借款本人可还款；还款金额 = 本金 + 利息 + 截至还款时刻的逾期罚息（本金 × 0.1% × 已开始逾期天数）。
        还款不因账号 `SUSPENDED` / `BANNED` 被阻断，以保证债务可以结清。
        重复还款返回 409 `LOAN_NOT_ACTIVE`，不会二次扣款。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: loanId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已还清
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelLoan'
              examples:
                repaid:
                  value:
                    id: 1
                    trip_id: 3
                    principal_cents: 100000
                    service_fee_cents: 5000
                    disbursed_cents: 95000
                    interest_cents: 700
                    repay_cents: 100700
                    penalty_cents: 0
                    total_repay_cents: 100700
                    term_days: 14
                    status: repaid
                    funded_at: '2026-11-16T09:00:00Z'
                    due_at: '2026-11-30T09:00:00Z'
                    repaid_at: '2026-11-16T10:00:00Z'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 余额不足或借款已非进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientBalance:
                  value:
                    code: INSUFFICIENT_BALANCE
                loanNotActive:
                  value:
                    code: LOAN_NOT_ACTIVE
        '500':
          $ref: '#/components/responses/Unexpected'

  /reports/mine:
    get:
      operationId: listMyReports
      summary: 我提交过的举报
      description: |
        通知中心跳转的举报详情页使用。只返回举报人已经知道的业务事实：编号、对象类型、
        原因、状态与时间；不返回管理员备注、处理人 id 或他人的处罚细节。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: limit
          in: query
          required: false
          description: 返回条数上限，默认与最大值为 50
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: 当前用户提交的举报，最新在前
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/MyReport'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /notifications:
    get:
      operationId: listNotifications
      summary: 最新通知与未读计数
      description: |
        返回当前用户最新 50 条通知与按类型拆分的未读计数（`total` + 八类 `by_type`）。
        未读定义为 `read_at` 为空，状态派生为 `UNREAD` / `READ`；列表按创建时间倒序。
        每条通知带 `target` 跳转目标与 `related_available`（关联业务是否仍可访问）。REST 列表不含消息正文。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      responses:
        '200':
          description: 最新通知与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /notifications/stream:
    get:
      operationId: streamNotifications
      summary: 通知推送通道（SSE）
      description: |
        该用户的服务器推送通道，事件名固定 `notification`，`data` 为单行 `NotificationEvent` JSON。
        连接期间约每 20 秒发送一次 `: ping` 心跳；不发送 `id:` 字段，重连正确性由客户端 REST 对账保证。
      parameters:
        - name: user_id
          in: query
          required: true
          description: 接收推送的演示用户 id（app_users.id）；缺省或用户不存在返回 401
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: SSE 事件流
          headers:
            Cache-Control:
              description: 固定 `no-cache`
              schema:
                type: string
            X-Accel-Buffering:
              description: 固定 `no`，禁止代理缓冲
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                notification:
                  value: |
                    event: notification
                    data: {"notification":{"id":7},"message":null}
        '401':
          $ref: '#/components/responses/DemoUserRequired'
  /notifications/{notificationId}/read:
    post:
      operationId: readNotification
      summary: 单条通知标读
      description: 只把本人且未读的该条记录标记为已读；重复标读计数不变。标读不改变业务状态。返回最新计数。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 最新未读计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCounts'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          description: 通知不存在或不属于当前用户（不暴露他人通知存在性）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: NOTIFICATION_NOT_FOUND
        '500':
          $ref: '#/components/responses/Unexpected'
  /notifications/read:
    post:
      operationId: readNotifications
      summary: 全部或单会话标读
      description: |
        `scope=all` 把本人全部未读标读并忽略定位字段；`scope=conversation` 需同时提供
        `trip_id` 与 `other_user_id`，只清该会话的聊天类通知，缺一返回 400。返回最新计数。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationReadRequest'
      responses:
        '200':
          description: 最新未读计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCounts'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'

components:
  parameters:
    DemoUserId:
      name: X-User-Id
      in: header
      required: true
      description: 演示身份标识（app_users.id）。演示环境无真实鉴权，生产前必须替换。
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 起；小于 1 视为非法输入。
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数，默认 20，最大 50；超出范围视为非法输入。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    BearerToken:
      name: Authorization
      in: header
      required: true
      description: 登录会话，格式 `Bearer <token>`。
      schema:
        type: string
  responses:
    DemoUserRequired:
      description: 缺少或未知的演示身份
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                code: DEMO_USER_REQUIRED
    InvalidInput:
      description: 输入不满足契约或业务约束
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                code: INVALID_INPUT
    Forbidden:
      description: 当前身份无权执行该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
    Unauthorized:
      description: 缺少或无效的登录会话
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sessionInvalid:
              value:
                code: SESSION_INVALID
    AdminRequired:
      description: 已登录但角色不是 ADMIN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            adminRequired:
              value:
                code: ADMIN_REQUIRED
    AccountRestricted:
      description: 账号处于 SUSPENDED 或 BANNED，不能执行该写操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            suspended:
              value:
                code: ACCOUNT_SUSPENDED
            banned:
              value:
                code: ACCOUNT_BANNED
    FinanceForbidden:
      description: 当前身份不是该行程同行者，或账号状态不允许金融写操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notParticipant:
              value:
                code: FORBIDDEN
            suspended:
              value:
                code: ACCOUNT_SUSPENDED
            banned:
              value:
                code: ACCOUNT_BANNED
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                code: TRIP_NOT_FOUND
    Conflict:
      description: 当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                code: DUPLICATE_APPLICATION
    Unexpected:
      description: 未预期异常，响应不携带堆栈
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unexpected:
              value:
                code: INTERNAL_ERROR
    AiNotConfigured:
      description: AI 服务尚未配置密钥
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notConfigured:
              value:
                code: AI_NOT_CONFIGURED
    AiUpstream:
      description: AI 上游失败、超时或输出非法（不自动重试）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            upstream:
              value:
                code: AI_UPSTREAM_ERROR
            invalidOutput:
              value:
                code: AI_INVALID_OUTPUT
            weatherFailed:
              value:
                code: WEATHER_UPSTREAM_ERROR
  schemas:
    Greeting:
      type: object
      required: [id, message]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: 问候语记录标识
        message:
          type: string
          readOnly: true
          description: 问候语文本，来自 greetings 表的 message 列
    DemoUser:
      type: object
      required: [id, nickname, avatar_initial, bio, interests, profile_complete, student_verified, role, status]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nickname:
          type: string
          readOnly: true
          description: 发布者昵称；唯一来源是 app_users.nickname
        avatar_initial:
          type: string
          readOnly: true
          description: 头像首字；无头像时的展示回退
        avatar_url:
          type: string
          nullable: true
          readOnly: true
          description: 头像地址（含缓存版本参数）；无头像时省略
        school:
          type: string
          nullable: true
          readOnly: true
          description: 学校与年级；选填，迁移前账号保留旧文案
        city:
          type: string
          nullable: true
          readOnly: true
          description: 所在城市
        major:
          type: string
          nullable: true
          readOnly: true
          description: 专业
        job:
          type: string
          nullable: true
          readOnly: true
          maxLength: 20
          description: 职业；预设值或「其他」自填文本
        bio:
          type: string
          readOnly: true
          description: 简介
        interests:
          type: array
          readOnly: true
          maxItems: 5
          items:
            type: string
            maxLength: 12
          description: 旅行兴趣标签
        profile_complete:
          type: boolean
          readOnly: true
          description: 由必填字段派生的资料完善状态，不落库
        student_verified:
          type: boolean
          readOnly: true
          description: 学信网学籍认证状态；未认证时发布 / 申请 / 聊天 / 分享体验返回 403 `STUDENT_VERIFICATION_REQUIRED`
        role:
          $ref: '#/components/schemas/AccountRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
    UserProfile:
      type: object
      required: [id, nickname, avatar_initial, interests, profile_complete, student_verified, credit_score, credit_level, credit_restricted, route_completion_state]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nickname:
          type: string
          readOnly: true
        avatar_initial:
          type: string
          readOnly: true
          description: 无头像时的展示回退字符（昵称首字）
        avatar_url:
          type: string
          nullable: true
          readOnly: true
          description: 头像地址 `/api/users/{id}/avatar?v={8 位 hex}`；无头像时省略
        birthday:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: 仅本人读取时出现；他人响应省略该键
        age:
          type: integer
          nullable: true
          readOnly: true
          description: 按当前日期计算的周岁；无生日时省略
        zodiac:
          type: string
          nullable: true
          readOnly: true
          enum: [摩羯, 水瓶, 双鱼, 白羊, 金牛, 双子, 巨蟹, 狮子, 处女, 天秤, 天蝎, 射手]
          description: 由生日派生的星座；无生日时省略
        gender:
          type: string
          nullable: true
          enum: [男, 女, 其他]
        city:
          type: string
          nullable: true
          description: 所在城市，1–40 字
        school:
          type: string
          nullable: true
          description: 学校，选填；≤80 字
        major:
          type: string
