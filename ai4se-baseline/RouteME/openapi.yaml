            schema:
              $ref: '#/components/schemas/ReportRequest'
            examples:
              success:
                value:
                  target_type: trip
                  target_id: 3
                  reason: safety
                  note: 集合地点与描述不符。
              rejected:
                value:
                  target_type: planet
                  target_id: 3
                  reason: safety
      responses:
        '201':
          description: 举报已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportReceipt'
        '400':
