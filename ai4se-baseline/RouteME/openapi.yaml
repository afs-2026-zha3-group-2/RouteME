  /credit/learning/sessions:
    post:
      operationId: startCreditLearningSession
      summary: 开始一次安全学习考试
      description: |
        只对当前信用分低于 60 的本人开放，分值为 60 及以上返回 409 `LEARNING_NOT_ELIGIBLE`。
        每次考试 10 题，覆盖旅行安全 / 陌生人同行 / 平台行为规范 / 隐私保护四类；题面不含答案，判分只在服务端。
        开始即计次：每自然月（北京时间）最多 2 次，超限返回 429 `LEARNING_EXAM_QUOTA_EXCEEDED`。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      responses:
        '201':
          description: 已建立考试会话并下发 10 道题
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSession'
              examples:
                lowScore:
                  value:
                    session_id: 12
                    questions:
                      - id: Q01
                        category: travel_safety
                        question: 夜间抵达陌生城市，第一件应该做的事是？
                        options:
                          - 先去网红点拍照，再慢慢找住处
                          - 先把住处与同行信息告知一位熟人
                          - 直接在路边随机找人问路
                          - 让出租车司机推荐住处
                      - id: Q06
                        category: stranger_companion
                        question: 首次与网友反向同行，出发前最该做的确认是？
                        options:
                          - 直接交换行程截图
                          - 核实对方真实身份并告知朋友行程
                          - 先到目的地再联系
                          - 只通过对方提供的电话沟通
                      - id: Q11
                        category: platform_rules
                        question: 同行集合迟到超过一小时且未告知，按平台规范应？
                        options:
                          - 不必理会
                          - 主动告知同行者与发布者
                          - 重新发布一条新行程
                          - 取消行程不告知
                      - id: Q16
                        category: privacy
                        question: 在群聊里分享住宿凭证时，应该怎么做？
                        options:
                          - 直接发送完整凭证原图
                          - 遮挡证件号与二维码后发送
                          - 把凭证发到公开社交平台
                          - 用凭证截图做头像
                      - id: Q03
                        category: travel_safety
                        question: 山区徒步遇到突降大雨，优先选择是？
                        options:
                          - 继续沿原路线前进
                          - 就近下撤到安全地带并告知同行者
                          - 在树下避雨等雨停
                          - 打开手机直播求助
                      - id: Q08
                        category: stranger_companion
                        question: 同行者要求临时改变已约定的集合点时，应该？
                        options:
                          - 立刻单独前往新集合点
                          - 重新协商并在公开群聊里确认
                          - 自行取消且不告知
                          - 把定位只发给对方
                      - id: Q13
                        category: platform_rules
                        question: 发现同行帖包含虚假信息时，应该？
                        options:
                          - 私下转发提醒朋友
                          - 使用平台举报入口并保留凭据
                          - 在评论区公开对方隐私
                          - 忽视即可
                      - id: Q18
                        category: privacy
                        question: 向同行者发送个人身份证照前，应当？
                        options:
                          - 直接发送未处理的原图
                          - 确认必要性并对号码与住址打码
                          - 发到群里让更多人看到
                          - 用他人证件代替
                      - id: Q04
                        category: travel_safety
                        question: 海边游玩看到离岸流提示旗，应该？
                        options:
                          - 只要会游泳就可以下水
                          - 不下水并劝阻同行者
                          - 走到浪花最深处拍视频
                          - 单独沿岸边远端下水
                      - id: Q19
                        category: privacy
                        question: 行程页展示住宿地址时，可以公开到什么粒度？
                        options:
                          - 公开门牌号与房间号
                          - 公开到街区或集合区域即可
                          - 公开房东联系方式
                          - 公开入住凭证截图
                    exam_used: 1
                    exam_limit: 2
                    month: '2026-11'
                    learning_completed: false
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                userNotFound:
                  value:
                    code: USER_NOT_FOUND
        '409':
          description: 当前信用分不满足恢复条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notEligible:
                  value:
                    code: LEARNING_NOT_ELIGIBLE
        '429':
          description: 本月考试次数已用尽
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                quotaExceeded:
                  value:
                    code: LEARNING_EXAM_QUOTA_EXCEEDED
        '500':
          $ref: '#/components/responses/Unexpected'
