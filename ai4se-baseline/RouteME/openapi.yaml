      description: |
        仅行程发布者可调用，且只在招募中与已满员时可用。
        两个字段整体替换：未传或传 null 视为清空，重复提交结果一致。
        集合时间使用本地墙上时间（无时区），日期部分不得晚于结束日期。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
