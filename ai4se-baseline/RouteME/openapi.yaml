    WeatherForecast:
      type: object
      required: [date, available, reminders, source]
      properties:
        date:
          type: string
          format: date
          readOnly: true
        destination_code:
          type: string
          nullable: true
          readOnly: true
        city:
          type: string
          nullable: true
          readOnly: true
        lng:
          type: number
          format: double
          nullable: true
          description: 实际使用的经度；不可用时为 null
          readOnly: true
        lat:
          type: number
          format: double
          nullable: true
          description: 实际使用的纬度；不可用时为 null
          readOnly: true
        available:
          type: boolean
          readOnly: true
          description: 该日期是否有可用的真实天气
        reason:
          type: string
          nullable: true
          readOnly: true
          enum: [OUT_OF_RANGE]
        weather:
          type: object
          nullable: true
          description: 天气不可用（超出预报窗口）时为 null
          allOf:
            - $ref: '#/components/schemas/WeatherDaily'
        reminders:
          type: array
          readOnly: true
          description: 出行提醒，按降雨 → 高温 → 紫外线 → 低温 → 温差 → 强风 → 平稳的固定顺序
          items:
            $ref: '#/components/schemas/WeatherReminder'
        source:
          type: string
          readOnly: true
          enum: [open-meteo]
    WeatherDaily:
      type: object
      required: [weather_text, temp_max_c, temp_min_c]
      properties:
        weather_code:
          type: integer
          nullable: true
          description: WMO 4677 天气码
        weather_text:
          type: string
          description: 天气码对应的中文文案；未收录时为「未知天气」
        temp_max_c:
          type: number
          format: double
        temp_min_c:
          type: number
          format: double
        precipitation_probability_pct:
          type: integer
          nullable: true
          description: 当日最大降雨概率（%）；上游缺省时为 null
        precipitation_mm:
          type: number
          format: double
          nullable: true
        wind_speed_kmh:
          type: number
          format: double
          nullable: true
        uv_index:
          type: number
          format: double
          nullable: true
          description: 当日最大紫外线指数；上游缺省时为 null，前端不展示也不参与提醒
    WeatherReminder:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
          enum: [rain, heat, uv, cold, temperature_gap, wind, calm]
        text:
          type: string
          description: 面向用户的完整文案，内含真实天气数值
    AiPlace:
      type: object
      required: [name, lng, lat]
      properties:
        name:
          type: string
          maxLength: 100
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
      description: 地点（名称 + 高德坐标）；坐标只能来自高德搜索/定位/选点，不得由 AI 产出
    AiGenerateRequest:
      type: object
      required: [origin, destination, date]
      properties:
        origin:
          $ref: '#/components/schemas/AiPlace'
        destination:
          $ref: '#/components/schemas/AiPlace'
        date:
          type: string
          format: date
          description: 旅行日期；今天 ≤ date ≤ 今天+15（Open-Meteo 预报窗口）
        duration:
          type: string
          enum: [half_day, one_day, two_day]
          default: one_day
        budget_cents:
          type: integer
          minimum: 0
          nullable: true
          description: 预算，整数分；选填
        travel_mode:
          type: string
          enum: [transit, walking, driving]
          default: transit
        interests:
          type: array
          maxItems: 7
          items:
            type: string
        pace:
          type: string
          enum: [relaxed, moderate, compact]
          default: moderate
        reduce_budget:
          type: boolean
          default: false
          description: 「AI 帮我降低预算」时为 true，提示词要求合计不超预算
    AiPlanStop:
      type: object
      required: [name, reason, arrival, stay_minutes, indoor]
      properties:
        name:
          type: string
          maxLength: 100
          description: POI 名称；必须真实存在、高德可搜；前端只取名称，坐标另行解析
        reason:
          type: string
          maxLength: 300
        arrival:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: 建议到达时间 HH:mm
        stay_minutes:
          type: integer
          minimum: 1
        indoor:
          type: boolean
          description: 是否室内活动；雨天推荐优先室内
      description: AI 推荐景点；不得携带经纬度/路线/距离/交通时间等地图字段
    AiPlanDay:
      type: object
      required: [day, stops]
      properties:
        day:
          type: integer
          minimum: 1
        stops:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AiPlanStop'
    AiBudget:
      type: object
      required: [transport_cents, tickets_cents, food_cents, other_cents, total_cents]
      properties:
        transport_cents:
          type: integer
          minimum: 0
        tickets_cents:
          type: integer
          minimum: 0
        food_cents:
          type: integer
          minimum: 0
        other_cents:
          type: integer
          minimum: 0
        total_cents:
          type: integer
          minimum: 0
          description: 四项之和；AI 输出不一致时后端重算
      description: 费用全部为 AI 估算，无真实价格来源；前端恒标「AI 估算」
    AiPlan:
      type: object
      required: [title, days, tips, packing, budget]
      properties:
        title:
          type: string
          maxLength: 40
        days:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AiPlanDay'
          description: 按天分组；全部 stops 合计至少 2 个
        tips:
          type: array
          items:
            type: string
          description: 基于真实天气的出行建议
        packing:
          type: array
          items:
            type: string
          description: 建议携带物品
        budget:
          $ref: '#/components/schemas/AiBudget'
    AiGenerateResponse:
      type: object
      required: [plan, weather]
      description: weather 为本次生成实际注入提示词的权威天气摘要（add-trip-weather 契约）
      properties:
        plan:
          $ref: '#/components/schemas/AiPlan'
        weather:
          $ref: '#/components/schemas/WeatherForecast'
    AiSnapshotStop:
      type: object
      required: [name, order, reason, arrival, stay_minutes, indoor, resolved]
      properties:
        name:
          type: string
          maxLength: 100
        lng:
          type: number
          format: double
          nullable: true
        lat:
          type: number
          format: double
          nullable: true
        order:
          type: integer
          minimum: 1
          description: 列表顺序号，与地图编号 Marker 一致
        reason:
          type: string
        arrival:
          type: string
          pattern: '^\d{2}:\d{2}$'
        stay_minutes:
          type: integer
          minimum: 1
        indoor:
          type: boolean
        resolved:
          type: boolean
          description: 高德解析成功为 true，此时 lng/lat 必须为数值；未解析不伪造坐标
    AiRouteLeg:
      type: object
      required: [from_id, to_id, distance_meters, duration_seconds]
      properties:
        from_id:
          type: string
        to_id:
          type: string
        distance_meters:
          type: integer
          minimum: 0
        duration_seconds:
          type: integer
          minimum: 0
    AiSnapshotRoute:
      type: object
      required: [mode, distance_meters, duration_seconds, legs]
      properties:
        mode:
          type: string
          enum: [transit, walking, driving]
        distance_meters:
          type: integer
          minimum: 0
        duration_seconds:
          type: integer
          minimum: 0
        legs:
          type: array
          items:
            $ref: '#/components/schemas/AiRouteLeg'
      description: 高德真实路线结果；距离/时间只能来自高德，不得由 AI 产出
    AiItinerarySnapshot:
      type: object
      required: [origin, destination, date, stops, travel_mode]
      description: 完整快照；route / weather / ai_budget 在对应服务失败时可为 null，不伪造数据
      properties:
        origin:
          $ref: '#/components/schemas/AiPlace'
        destination:
          $ref: '#/components/schemas/AiPlace'
        date:
          type: string
          format: date
        duration:
          type: string
          enum: [half_day, one_day, two_day]
        travel_mode:
          type: string
          enum: [transit, walking, driving]
        interests:
          type: array
          items:
            type: string
        pace:
          type: string
          enum: [relaxed, moderate, compact]
        budget_cents:
          type: integer
          minimum: 0
          nullable: true
        stops:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/AiSnapshotStop'
          description: 已解析（resolved=true）至少 2 个且坐标为数值，否则 400
        route:
          $ref: '#/components/schemas/AiSnapshotRoute'
        weather:
          $ref: '#/components/schemas/WeatherForecast'
        tips:
          type: array
          items:
            type: string
        packing:
          type: array
          items:
            type: string
        ai_budget:
          $ref: '#/components/schemas/AiBudget'
    AiItinerarySaved:
      type: object
