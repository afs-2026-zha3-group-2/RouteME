          in: query
          required: false
          description: 目的地 6 位行政区划代码（二级）
          schema:
            type: string
            pattern: '^[0-9]{6}$'
            example: '440400'
        - name: date_from
          in: query
          required: false
          description: 出发不早于（与关联行程日期区间取交集）
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: 出发不晚于（与关联行程日期区间取交集）
          schema:
            type: string
            format: date
        - name: tags
          in: query
          required: false
          description: 逗号分隔，任一命中
          schema:
            type: string
      responses:
        '200':
          description: 体验列表的一页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperiencePage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /experiences/{experienceId}/likes:
    post:
      operationId: likeExperience
      summary: 点赞他人的旅行体验
      description: |
        已登录用户对他人体验点赞；首次创建返回 201，已点过赞幂等返回 200。
        同一用户对同一体验至多一条点赞记录；自己的体验返回 403；体验不存在返回 404。
        新点赞成功后同事务触发获赞信用结算，每个档位只结算一次。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: experienceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: 首次点赞成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceLike'
              examples:
                created:
                  value:
                    experience_id: 1
                    like_count: 5
                    is_liked: true
        '200':
          description: 已点过赞，幂等返回当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceLike'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 体验不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: EXPERIENCE_NOT_FOUND
        '500':
          $ref: '#/components/responses/Unexpected'
    delete:
      operationId: unlikeExperience
      summary: 取消点赞
      description: 删除当前用户对该体验的点赞记录；未点赞时同样返回 204（幂等）。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: experienceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 已取消（未点赞时同样视为成功）
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          description: 体验不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: EXPERIENCE_NOT_FOUND
        '500':
          $ref: '#/components/responses/Unexpected'
