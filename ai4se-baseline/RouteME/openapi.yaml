openapi: 3.0.3
info:
  title: RouteME API
  version: 0.8.0
  description: |
    RouteME 后端对外契约。本文件是前后端唯一事实源，字段名、类型、状态码与错误码只在这里定稿。
        当前包含：脚手架问候语、演示账户与账号认证（注册/登录/会话/退出）、旅行计划（浏览/筛选/发布/详情/结束），同行匹配、申请、退出、聊天、我的旅行与举报，以及游后体验分享与参考发布所需数据。
        行程与体验列表按页返回：`page` 从 1 起，`size` 默认 20、上限 50。
        目的地为用户在地图地点库中搜索或点选的城市/地点名称，不再限定固定枚举。
        用户公开资料只返回白名单字段与四项统计，不要求身份头，也不返回账号凭据。
servers:
  - url: http://localhost:8080/api
    description: 本地开发
paths:
  /greeting:
    get:
      operationId: loadGreeting
      summary: 读取当前问候语
      description: |
        问候语是单例资源：greetings 表中只有一条记录，因此路径用单数名词。
        文本由 Flyway 迁移写入，接口只读。
      responses:
        '200':
          description: 当前问候语
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
              examples:
                seeded:
                  value:
                    id: 1
                    message: Hello World
        '404':
          description: greetings 表没有记录，问候语尚未写入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: GREETING_NOT_FOUND
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /users:
    get:
      operationId: loadDemoUsers
      summary: 读取演示账户
      description: 身份门使用。演示环境固定 3 个账户，不做注册与鉴权。
      responses:
        '200':
          description: 演示账户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoUser'
              examples:
                seeded:
                  value:
                    - id: 1
                      nickname: 林见夏
                      avatar_initial: 夏
                      school: 大三 · 视觉传达
                      bio: 拍照比走路多。
                      interests: [摄影, 海边, 美食]
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /users/demo:
    get:
      operationId: loadDemoOnlyUsers
      summary: 读取演示账户
      description: 身份门使用。只返回没有用户名凭据的 4 个预设账户，注册账号不会出现在这里。
      responses:
        '200':
          description: 演示账户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoUser'
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /users/{id}/profile:
    get:
      operationId: loadUserProfile
      summary: 读取用户公开资料
      description: |
        只返回公开字段与四项旅行统计，不要求 X-User-Id 或登录会话。
        响应不包含用户名、密码散列、会话令牌，也不包含电话、证件、精确住址、学校门牌或实时位置。
        共同兴趣由前端用当前用户兴趣计算，不在本端点返回。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 用户公开资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                seeded:
                  value:
                    id: 1
                    nickname: 林见夏
                    avatar_initial: 夏
                    school: 大三 · 视觉传达
                    bio: 拍照比走路多。
                    interests: [摄影, 海边, 美食]
                    joined_at: '2026-01-12T08:30:00Z'
                    stats:
                      published: 2
                      completed: 1
                      joined: 3
                      shared: 2
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: USER_NOT_FOUND
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /auth/register:
    post:
      operationId: registerAccount
      summary: 注册账号并自动登录
      description: |
        用户名不区分大小写、唯一；密码以 PBKDF2-HMAC-SHA256 加盐散列保存。
        注册成功即签发会话，前端可直接进入首页。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '201':
          description: 账号已创建并登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: 用户名/密码/昵称等字段不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '409':
          description: 用户名已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                taken:
                  value:
                    code: USERNAME_TAKEN
  /auth/login:
    post:
      operationId: loginAccount
      summary: 用户名密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: 请求体缺少用户名或密码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '401':
          description: 用户名不存在、密码错误，或演示账户没有密码凭据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    code: INVALID_CREDENTIALS
  /auth/me:
    get:
      operationId: loadSessionUser
      summary: 读取当前登录用户
      parameters:
        - $ref: '#/components/parameters/BearerToken'
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoUser'
        '401':
          description: token 缺失、不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSession:
                  value:
                    code: SESSION_INVALID
  /auth/logout:
    post:
      operationId: logoutAccount
      summary: 退出登录
      description: 删除当前 token；重复退出仍返回 204。
      parameters:
        - $ref: '#/components/parameters/BearerToken'
      responses:
        '204':
          description: 会话已删除
        '401':
          description: token 缺失或无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidSession:
                  value:
                    code: SESSION_INVALID
  /trips:
    get:
      operationId: loadTrips
      summary: 浏览未结束的旅行计划
      description: |
        只返回未结束（completed_at 为空）的行程；已结束与已取消不在列表中。
        结果为分页对象：`total` 是筛选后的命中总数，`total_pages` 为向上取整的页数。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: 关键词，匹配标题、目的地、途经点、标签与发布者昵称（大小写不敏感包含）
          schema:
            type: string
        - name: destination
          in: query
          description: 目的地，精确匹配地图地点库中的城市或地点名称
          schema:
            type: string
            maxLength: 40
        - name: date_from
          in: query
          description: 出发不早于（与行程日期区间取交集）
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          description: 出发不晚于（与行程日期区间取交集）
          schema:
            type: string
            format: date
        - name: tags
          in: query
          description: 兴趣标签，逗号分隔，命中任一即保留
          schema:
            type: string
      responses:
        '200':
          description: 未结束行程的一页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
              examples:
                filtered:
                  value:
                    items:
                      - id: 3
                        title: 珠海情侣路日落机位二刷
                        destination: 珠海
                        start_date: '2026-11-16'
                        end_date: '2026-11-16'
                        stops: [香洲港集合, 情侣北路步行, 海滨泳场日落]
                        tags: [摄影, 海边]
                        capacity: 3
                        joined_count: 1
                        status: recruiting
                        publisher:
                          id: 2
                          nickname: 陈屿
                          avatar_initial: 屿
                          school: 研一 · 地理科学
                          bio: 周末基本在山里。
                          interests: [徒步, 自然, 露营]
                        created_at: '2026-11-12T14:05:00Z'
                    page: 1
                    size: 20
                    total: 1
                    total_pages: 1
        '400':
          description: 查询参数不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '401':
          description: 缺少或未知的演示身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: DEMO_USER_REQUIRED
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
    post:
      operationId: createTrip
      summary: 发布旅行计划
      description: |
        必填与约束见 TripCreateRequest。目的地只接受二级行政区划代码；名称由后端按字典生成（直辖市取省级名）。
        发布成功后状态为 recruiting，joined_count 计入发布者本人。
        字段级提示由前端表单给出；后端校验失败（含省级代码、字典中不存在的代码）统一返回 400 INVALID_INPUT。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreateRequest'
            examples:
              success:
                value:
                  title: 广州老城骑楼扫街半日
                  destination_code: '440100'
                  start_date: '2026-11-16'
                  end_date: '2026-11-16'
                  stops: [陈家祠地铁站集合, 恩宁路骑楼, 永庆坊]
                  meeting_area: 陈家祠地铁站 D 口
                  budget_min_cents: 8000
                  budget_max_cents: 15000
                  tags: [摄影, 历史, 美食]
                  capacity: 4
                  note: 走街串巷为主，随时可以停下来吃东西。
              rejected:
                value:
                  title: ''
                  destination_code: '440000'
                  start_date: '2026-11-16'
                  end_date: '2026-11-15'
                  stops: [只有一处]
                  capacity: 1
      responses:
        '201':
          description: 发布成功，返回行程详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '400':
          description: 必填缺失或约束不满足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: INVALID_INPUT
        '401':
          description: 缺少或未知的演示身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: DEMO_USER_REQUIRED
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /trips/{tripId}:
    get:
      operationId: loadTrip
      summary: 查看行程详情
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 行程详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '401':
          description: 缺少或未知的演示身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: DEMO_USER_REQUIRED
        '404':
          description: 行程不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: TRIP_NOT_FOUND
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /trips/{tripId}/complete:
    post:
      operationId: completeTrip
      summary: 标记行程已结束
      description: 仅行程发布者可调用。结束后 completed_at 写入，行程不再出现在默认列表。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已结束的行程详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '401':
          description: 缺少或未知的演示身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingUser:
                  value:
                    code: DEMO_USER_REQUIRED
        '403':
          description: 非发布者不能结束行程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
        '404':
          description: 行程不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    code: TRIP_NOT_FOUND
        '409':
          description: 行程已结束
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyCompleted:
                  value:
                    code: TRIP_NOT_OPEN
        '500':
          description: 未预期异常，响应不携带堆栈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unexpected:
                  value:
                    code: INTERNAL_ERROR
  /matches:
    get:
      operationId: loadMatches
      summary: 浏览带匹配原因的候选行程
      description: |
        在未结束行程上追加匹配分与理由：目的地相同 50、出发日期相同 30、相差一天 20、
        共同兴趣每项 10 且合计不超过 20；默认按匹配分倒序。筛选参数与 /trips 相同。
        匹配分在应用层计算，因此先算完整候选再切页；`total` 仍是筛选后的命中数。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          schema:
            type: string
        - name: destination
          in: query
          schema:
            type: string
            maxLength: 40
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: tags
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [match, date, new]
            default: match
      responses:
        '200':
          description: 候选行程与匹配信息的一页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /matches/{tripId}:
    get:
      operationId: loadMatch
      summary: 查看单条行程的匹配信息
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 匹配信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchCandidate'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
  /trips/{tripId}/applications:
    get:
      operationId: loadTripApplications
      summary: 发布者查看行程申请
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 申请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripApplication'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: applyForTrip
      summary: 提交同行申请
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
            examples:
              success:
                value:
                  message: 这条线我走过一半，想补上日落那段。
              rejected:
                value:
                  message: 重复申请会在服务端被拒绝，说明为选填且不超过 120 字。
      responses:
        '201':
          description: 已创建待处理申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApplication'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Unexpected'
  /me/applications:
    get:
      operationId: loadMyApplications
      summary: 我的同行申请
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      responses:
        '200':
          description: 我的申请列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripApplication'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /applications/{applicationId}/cancel:
    post:
      operationId: cancelApplication
      summary: 申请者取消待处理申请
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已取消的申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApplication'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /applications/{applicationId}/accept:
    post:
      operationId: acceptApplication
      summary: 发布者接受申请
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已接受的申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApplication'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /applications/{applicationId}/reject:
    post:
      operationId: rejectApplication
      summary: 发布者拒绝申请
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已拒绝的申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripApplication'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/leave:
    post:
      operationId: leaveTrip
      summary: 已接受的同行者退出
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 已退出
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{tripId}/messages:
    get:
      operationId: loadMessages
      summary: 读取与某位同行者的消息
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: with
          in: query
          required: true
          description: 对方用户 id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 消息列表，按发送时间升序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: sendMessage
      summary: 发送文字消息
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
            examples:
              success:
                value:
                  receiver_id: 2
                  content: 周六九点陈家祠 D 口集合，可以吗？
              rejected:
                value:
                  receiver_id: 2
                  content: ''
      responses:
        '201':
          description: 已保存的消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/chat-partners:
    get:
      operationId: loadChatPartners
      summary: 我的聊天对象
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      responses:
        '200':
          description: 按最后一条消息时间倒序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatPartner'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
  /me/trips:
    get:
      operationId: loadMyTrips
      summary: 我的旅行聚合
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      responses:
        '200':
          description: 我发布的、我申请的、已匹配、已完成与待处理数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTrips'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /reports:
    post:
      operationId: submitReport
      summary: 举报行程或用户
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            examples:
              success:
                value:
                  target_type: trip
                  target_id: 3
                  reason: safety
                  note: 集合地点与描述不符。
              rejected:
                value:
                  target_type: planet
                  target_id: 3
                  reason: safety
      responses:
        '201':
          description: 举报已记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportReceipt'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /experiences:
    get:
      operationId: loadExperiences
      summary: 旅行体验列表
      description: 已发布体验，按最近保存时间倒序；支持关键词、目的地与兴趣筛选，结果按页返回。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          required: false
          description: 关键词，命中行程标题/目的地/感受/建议
          schema:
            type: string
        - name: destination
          in: query
          required: false
          schema:
            type: string
        - name: tags
          in: query
          required: false
          description: 逗号分隔，任一命中
          schema:
            type: string
      responses:
        '200':
          description: 体验列表的一页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperiencePage'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /me/experiences:
    get:
      operationId: loadMyExperiences
      summary: 我的旅行体验
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
      responses:
        '200':
          description: 我的体验列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '500':
          $ref: '#/components/responses/Unexpected'
  /trips/{tripId}/experiences:
    get:
      operationId: loadTripExperiences
      summary: 某条行程的游后体验
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 体验列表，按首次发布时间升序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experience'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
    post:
      operationId: shareTripExperience
      summary: 发布或修改我的游后体验
      description: 仅已结束且自己参加过的行程；同一用户对同一行程只有一条体验，再次提交即修改。
      parameters:
        - $ref: '#/components/parameters/DemoUserId'
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceWriteRequest'
            examples:
              success:
                value:
                  content: 整条线基本没有爬升，骑行段风很大但很值。日落前四十分钟到海滨泳场刚好。
                  intensity: moderate
                  advice: 带一件防风外套，海边傍晚温差比市区大。
              rejected:
                value:
                  content: 太短
                  intensity: relaxed
                  advice: ''
      responses:
        '200':
          description: 已更新我的体验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '201':
          description: 已创建我的体验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/DemoUserRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
components:
  parameters:
    DemoUserId:
      name: X-User-Id
      in: header
      required: true
      description: 演示身份标识（app_users.id）。演示环境无真实鉴权，生产前必须替换。
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 起；小于 1 视为非法输入。
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数，默认 20，最大 50；超出范围视为非法输入。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    BearerToken:
      name: Authorization
      in: header
      required: true
      description: 登录会话，格式 `Bearer <token>`。
      schema:
        type: string
  responses:
    DemoUserRequired:
      description: 缺少或未知的演示身份
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                code: DEMO_USER_REQUIRED
    InvalidInput:
      description: 输入不满足契约或业务约束
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                code: INVALID_INPUT
    Forbidden:
      description: 当前身份无权执行该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                code: TRIP_NOT_FOUND
    Conflict:
      description: 当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              value:
                code: DUPLICATE_APPLICATION
    Unexpected:
      description: 未预期异常，响应不携带堆栈
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unexpected:
              value:
                code: INTERNAL_ERROR
  schemas:
    Greeting:
      type: object
      required: [id, message]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: 问候语记录标识
        message:
          type: string
          readOnly: true
          description: 问候语文本，来自 greetings 表的 message 列
    DemoUser:
      type: object
      required: [id, nickname, avatar_initial, school, bio, interests]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nickname:
          type: string
          readOnly: true
          description: 发布者昵称
        avatar_initial:
          type: string
          readOnly: true
          description: 头像首字
        school:
          type: string
          readOnly: true
          description: 学校与年级
        bio:
          type: string
          readOnly: true
          description: 简介
        interests:
          type: array
          readOnly: true
          items:
            type: string
          description: 旅行兴趣标签
    UserProfile:
      type: object
      required: [id, nickname, avatar_initial, school, bio, interests, joined_at, stats]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nickname:
          type: string
          readOnly: true
          description: 发布者昵称
        avatar_initial:
          type: string
          readOnly: true
          description: 头像首字
        school:
          type: string
          readOnly: true
          description: 身份/年级与专业或行业，MBTI 选填；例如「大三 · 软件工程专业 · ENTJ」或「上班族 · 互联网行业 · INFP」
          example: 上班族 · 互联网行业 · INFP
        bio:
          type: string
          readOnly: true
          description: 简介
        interests:
          type: array
          readOnly: true
          items:
            type: string
          description: 旅行兴趣标签
        joined_at:
          type: string
          format: date-time
          readOnly: true
          description: 用户加入时间，UTC
        stats:
          $ref: '#/components/schemas/ProfileStats'
    ProfileStats:
      type: object
      required: [published, completed, joined, shared]
      properties:
        published:
          type: integer
          readOnly: true
          description: 发布的行程数
        completed:
          type: integer
          readOnly: true
          description: 发布的已结束行程数
        joined:
          type: integer
          readOnly: true
          description: 被接受的同行申请数
        shared:
          type: integer
          readOnly: true
          description: 发布的游后体验数
    AuthRegisterRequest:
      type: object
      required: [username, password, nickname, school, interests]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[A-Za-z0-9_]+$'
          description: 登录用户名；不区分大小写，唯一
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          description: 明文密码只用于注册请求，服务端只保存加盐散列
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        avatar_initial:
          type: string
          maxLength: 4
          description: 选填；缺省时取昵称首字
        school:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        interests:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 12
    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AuthSession:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          readOnly: true
          description: 不透明会话 token，作为 Authorization 头的 Bearer 凭据使用
        expires_at:
          type: string
          format: date-time
          readOnly: true
          description: 过期时间，UTC；默认签发后 7 天
        user:
          $ref: '#/components/schemas/DemoUser'
    TripPlan:
      type: object
      required:
        [id, title, destination, start_date, end_date, stops, tags, capacity, joined_count, status, publisher, created_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
          maxLength: 40
        destination:
          type: string
          maxLength: 40
          description: 目的地名称，来自离线地图地点库（城市或可搜索的地点）
        start_date:
          type: string
          format: date
          description: 出发日期（日历日期）
        end_date:
          type: string
          format: date
          description: 结束日期（日历日期，不早于 start_date）
        stops:
          type: array
          minItems: 2
          items:
            type: string
          description: 途经点，至少两个
        tags:
          type: array
          maxItems: 5
          items:
            type: string
        capacity:
          type: integer
          minimum: 2
          maximum: 12
          description: 计划人数，含发布者
        joined_count:
          type: integer
          minimum: 1
          readOnly: true
          description: 已加入人数，含发布者；由 trip-plans 维护
        status:
          type: string
          enum: [recruiting, full, completed]
          readOnly: true
          description: 由 completed_at 与人数推导，不是独立写入的列
        publisher:
          $ref: '#/components/schemas/DemoUser'
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: 创建时间，UTC
    TripDetail:
      allOf:
        - $ref: '#/components/schemas/TripPlan'
        - type: object
          required: [participants]
          properties:
            meeting_area:
              type: string
              nullable: true
              description: 集合区域，选填
            note:
              type: string
              nullable: true
              description: 补充说明，选填
            budget_min_cents:
              type: integer
              nullable: true
              minimum: 0
              description: 预算下限，整数分
            budget_max_cents:
              type: integer
              nullable: true
              minimum: 0
              description: 预算上限，整数分，不高于下限
            participants:
              type: array
              readOnly: true
              items:
                $ref: '#/components/schemas/DemoUser'
              description: 当前同行者；MVP 只含发布者，REQ-003 落地后补已接受同行者
            completed_at:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: 结束时间；非空表示已结束
    TripCreateRequest:
      type: object
      required: [title, destination_code, start_date, end_date, stops, capacity]
      properties:
        title:
          type: string
          maxLength: 40
        destination_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 目的地二级行政区划代码（必须选到市，含港澳台二级区）；名称由后端按字典生成
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        stops:
          type: array
          minItems: 2
          items:
            type: string
        meeting_area:
          type: string
          maxLength: 100
        budget_min_cents:
          type: integer
          minimum: 0
        budget_max_cents:
          type: integer
          minimum: 0
        tags:
          type: array
          maxItems: 5
          items:
            type: string
        capacity:
          type: integer
          minimum: 2
          maximum: 12
        note:
          type: string
          maxLength: 500
    Match:
      type: object
      required: [score, percentage, reasons, basis]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            type: string
        basis:
          type: string
          description: 参照物说明（最近一条未结束的已发布行程，或我的兴趣与当前筛选）
    MatchCandidate:
      type: object
      required: [trip, match]
      properties:
        trip:
          $ref: '#/components/schemas/TripPlan'
        match:
          $ref: '#/components/schemas/Match'
    TripPage:
      type: object
      required: [items, page, size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripPlan'
          description: 当前页的行程
        page:
          type: integer
          minimum: 1
          description: 当前页码，从 1 起
        size:
          type: integer
          minimum: 1
          maximum: 50
          description: 每页条数
        total:
          type: integer
          format: int64
          minimum: 0
          description: 筛选后的命中总数，不是全量行程数
        total_pages:
          type: integer
          minimum: 0
          description: 命中总数按 size 向上取整的页数
    MatchPage:
      type: object
      required: [items, page, size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          format: int64
          minimum: 0
          description: 筛选后的候选总数
        total_pages:
          type: integer
          minimum: 0
    ApplicationCreateRequest:
      type: object
      properties:
        message:
          type: string
          maxLength: 120
          nullable: true
          description: 选填的一句申请说明，未填时对方看到「未填写申请说明」
    TripApplication:
      type: object
      required: [id, trip_id, applicant, status, created_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        trip_id:
          type: integer
          format: int64
          readOnly: true
        applicant:
          $ref: '#/components/schemas/DemoUser'
        message:
          type: string
          maxLength: 120
          nullable: true
        status:
          type: string
          enum: [pending, accepted, rejected, cancelled]
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        decided_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        trip:
          $ref: '#/components/schemas/TripPlan'
    ChatMessage:
      type: object
      required: [id, trip_id, sender_id, receiver_id, content, sent_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        trip_id:
          type: integer
          format: int64
          readOnly: true
        sender_id:
          type: integer
          format: int64
          readOnly: true
        receiver_id:
          type: integer
          format: int64
          readOnly: true
        content:
          type: string
          maxLength: 500
        sent_at:
          type: string
          format: date-time
          readOnly: true
    ChatMessageRequest:
      type: object
      required: [receiver_id, content]
      properties:
        receiver_id:
          type: integer
          format: int64
        content:
          type: string
          maxLength: 500
    ChatPartner:
      type: object
      required: [trip, other, message_count]
      properties:
        trip:
          $ref: '#/components/schemas/TripPlan'
        other:
          $ref: '#/components/schemas/DemoUser'
        last_message:
          $ref: '#/components/schemas/ChatMessage'
        message_count:
          type: integer
          minimum: 0
    MyTrips:
      type: object
      required: [published, applied, matched, completed, pending_application_count]
      properties:
        published:
          type: array
          items:
            $ref: '#/components/schemas/TripPlan'
        applied:
          type: array
          items:
            $ref: '#/components/schemas/TripApplication'
        matched:
          type: array
          items:
            $ref: '#/components/schemas/TripPlan'
        completed:
          type: array
          items:
            $ref: '#/components/schemas/TripPlan'
        pending_application_count:
          type: integer
          minimum: 0
    ExperienceWriteRequest:
      type: object
      required: [content, intensity, advice]
      properties:
        content:
          type: string
          minLength: 10
          maxLength: 400
          description: 真实感受，去空白后 10–400 字
        intensity:
          type: string
          enum: [relaxed, moderate, tiring]
          description: 路线强度
        advice:
          type: string
          minLength: 1
          maxLength: 120
          description: 给后来者的一条建议
    Experience:
      type: object
      required: [id, trip, author, content, intensity, advice, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        trip:
          $ref: '#/components/schemas/TripPlan'
        author:
          $ref: '#/components/schemas/DemoUser'
        content:
          type: string
          maxLength: 400
        intensity:
          type: string
          enum: [relaxed, moderate, tiring]
        advice:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ExperiencePage:
      type: object
      required: [items, page, size, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Experience'
          description: 当前页的游后体验
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          format: int64
          minimum: 0
          description: 筛选后的体验总数
        total_pages:
          type: integer
          minimum: 0
    ReportRequest:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type:
          type: string
          enum: [trip, user]
        target_id:
          type: integer
          format: int64
        reason:
          type: string
          enum: [harassment, fake, safety, other]
        note:
          type: string
          maxLength: 200
          nullable: true
    ReportReceipt:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          readOnly: true
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 大写下划线错误码，前端按原值判断
          enum:
            [GREETING_NOT_FOUND, INVALID_INPUT, DEMO_USER_REQUIRED, FORBIDDEN, TRIP_NOT_FOUND, TRIP_NOT_OPEN,
             APPLICATION_NOT_FOUND, APPLICATION_NOT_PENDING, DUPLICATE_APPLICATION, CHAT_NOT_ALLOWED, CHAT_READ_ONLY,
             EXPERIENCE_NOT_ALLOWED, USERNAME_TAKEN, INVALID_CREDENTIALS, SESSION_INVALID, USER_NOT_FOUND, INTERNAL_ERROR]
