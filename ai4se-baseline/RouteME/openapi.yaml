          minItems: 4
          maxItems: 4
          items:
            type: string
    LearningSession:
      type: object
      required: [session_id, questions, exam_used, exam_limit, month, learning_completed]
      properties:
        session_id:
          type: integer
          format: int64
          readOnly: true
          description: 考试会话标识
        questions:
          type: array
          readOnly: true
          description: 本次抽中的 10 道题，顺序即作答下标
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/LearningQuestion'
        exam_used:
          type: integer
          readOnly: true
