name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai4se-baseline/RouteME/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai4se-baseline/RouteME/backend/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Verify backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai4se-baseline/RouteME/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai4se-baseline/RouteME/frontend/package-lock.json
      - name: Upgrade npm
        # npm 10.9.9 bundled with Node 22 crashes with "Exit handler never called!"
        # while resolving rolldown platform optional dependencies on Linux.
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and test
        run: npm run build && npm test

  docker:
    name: Docker image (deployable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ai4se-baseline/RouteME
          file: ai4se-baseline/RouteME/Dockerfile
          push: false
          tags: routeme:ci
          cache-from: type=gha,scope=routeme-image
          cache-to: type=gha,mode=max,scope=routeme-image
