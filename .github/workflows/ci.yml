name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai4se-baseline/RouteME/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai4se-baseline/RouteME/backend/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Verify backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai4se-baseline/RouteME/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai4se-baseline/RouteME/frontend/package-lock.json
      - name: Install dependencies
        # npm 10.9.9 crashes with "Exit handler never called!" while resolving
        # rolldown platform optional dependencies on the Linux runner. Keep npm ci
        # as the primary path and fall back to npm install, which still honours
        # package-lock.json.
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Build and test
        run: npm run build && npm test
