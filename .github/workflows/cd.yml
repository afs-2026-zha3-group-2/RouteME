name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cd-main
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai4se-baseline/RouteME/frontend/package-lock.json

      - name: Build frontend dist
        working-directory: ai4se-baseline/RouteME/frontend
        run: |
          npm install -g npm@11
          npm install --no-audit --no-fund
          npm run build

      - name: Pack frontend into backend static
        run: |
          mkdir -p ai4se-baseline/RouteME/backend/src/main/resources/static
          cp -r ai4se-baseline/RouteME/frontend/dist/. ai4se-baseline/RouteME/backend/src/main/resources/static/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai4se-baseline/RouteME/backend/pom.xml

      - name: Build standalone jar
        working-directory: ai4se-baseline/RouteME/backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests package

      - name: Stage deliverables
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p dist-out
          cp ai4se-baseline/RouteME/backend/target/routeme-backend-0.0.1-SNAPSHOT.jar \
             "dist-out/routeme-standalone-${SHA}.jar"
          cd ai4se-baseline/RouteME/frontend
          zip -qr "$GITHUB_WORKSPACE/dist-out/routeme-frontend-dist.zip" dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: routeme-${{ github.event.workflow_run.head_sha || github.sha }}
          if-no-files-found: error
          path: dist-out/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TAG="build-${SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Release exists::$TAG already published; artifacts uploaded only."
            echo "### Release $TAG already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "自动交付：提交 \`$SHA\` 通过 CI 后构建。"
            echo ""
            echo "- \`routeme-standalone-<sha>.jar\`：前端 dist 已打进 Spring Boot static，单个 jar 同时提供页面与 /api"
            echo "- \`routeme-frontend-dist.zip\`：纯前端静态产物"
            echo ""
            echo "本地演示：\`java -jar routeme-standalone-<sha>.jar\`，打开 http://localhost:8080"
            echo "数据库默认 \`../SqlLite/routeme.db\`，可用 \`SPRING_DATASOURCE_URL\` 覆盖。"
          } > release-notes.md
          gh release create "$TAG" \
            --title "RouteME $TAG" \
            --target "$SHA" \
            --notes-file release-notes.md \
            dist-out/*
          echo "### Release $TAG published" >> "$GITHUB_STEP_SUMMARY"